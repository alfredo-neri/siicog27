<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<p:growl id="growlReportador" showDetail="true" sticky="true" />
			<h:form id="formTable">
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Archivo TXT Reconducciones del Presupuesto de Ingresos y Egresos</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<h:outputText
						value="Seleccione el mes y presione el botón Correcto" />
					<h:panelGrid id="display_2" columns="7"
						styleClass="col-centered ui-noborder">
						<h:outputText value="Mes: " for="mesInputOri"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />
						<p:selectOneMenu id="mesInputOri"
							value="#{reconducPresupEgrIngrTxtMB.tcMes}"
							style="padding-right:20px;">
							<f:selectItems value="#{reconducPresupEgrIngrTxtMB.listMes}"
								var="item" itemValue="#{item.mes}" itemLabel="#{item.mes}" />
						</p:selectOneMenu>
								&nbsp;&nbsp;
								<p:commandButton icon="pi pi-play" id="generareportetxt"
							style="padding-left: 3px;"
							action="#{reconducPresupEgrIngrTxtMB.generaReporte}"
							value="Generar" ajax="false">
						</p:commandButton>
					</h:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
