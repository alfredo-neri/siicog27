<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Reporte Ejercido Por Capitulo</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="3"
						styleClass="ui-noborder col-centered row-centered" layout="tabular">
						<p:outputLabel value="Mes:" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{ejercidoProgramaMB.mes}">
							<f:selectItems value="#{ejercidoProgramaMB.listMeses}"
								var="meses" itemValue="#{meses}" itemLabel="#{meses}" />
						</p:selectOneMenu>
						<p:selectOneRadio id="console"
							value="#{ejercidoProgramaMB.programa}" unselectable="true">
							<f:selectItem itemLabel="Programa" itemValue="8" />
							<f:selectItem itemLabel="Proyecto" itemValue="12" />

						</p:selectOneRadio>
						<p:panelGrid columns="3"
							styleClass="ui-noborder col-centered col-md-3 row-centered" layout="tabular">
							<p:commandButton value="Download" ajax="false"
								onclick="PrimeFaces.monitorDownload(start, stop);"
								icon="ui-icon-arrowthickstop-1-s">
								<p:fileDownload value="#{ejercidoProgramaMB.file}" />
							</p:commandButton>
						</p:panelGrid>




					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>

			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
