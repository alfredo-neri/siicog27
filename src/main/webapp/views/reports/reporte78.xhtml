<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Servicios Personales del Mes</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">

						
							
							
							<p:panelGrid columns="9" styleClass="ui-noborder" layout="tabular">
							<h:outputText value="Mes: " for="idMes" />
								<p:selectOneMenu id="idMes" value="#{reporte78MB.mes}">
									<f:selectItems value="#{reporte78MB.listMes}" var="meses"
										itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
								</p:selectOneMenu>
							
							
							
														

							<!-- <h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);"
										title="EXCEL">
										<p:graphicImage value="excel.png" width="24" />
										<p:fileDownload value="#{reporte78MB.fileXls}" />
									</h:commandLink> -->

							<!-- 									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{reporte78MB.fileCsv}" />
									</h:commandLink>
									
									
									
									 -->
							<!-- <h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="PDF">
								<p:graphicImage value="pdf.png" width="24" />
								<p:fileDownload value="#{reporte78MB.filePdf}" />
							</h:commandLink>
							-->
							
							
							<h:outputText value="" />
							
							<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" styleClass="sg-btn-sm">
										<i class="pi pi-file" /> TXT
										<p:fileDownload value="#{reporte78MB.fileTxt}"/>
							</h:commandLink>
							
							
							
						
									
									
							<!-- <p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{reporte78MB.createFilePdfInline}" value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton> -->
							
							

						</p:panelGrid>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (reporte78MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Aquí se mostrará el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{reporte78MB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{reporte78MB.uuid}&amp;filename=#{reporte78MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>

			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
