<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="messagesEdit" showDetail="true" sticky="true" />
				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{eAPEProyectoMB.fileXls}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado de Avance Presupuestal de Egresos por Proyecto</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid styleClass="ui-noborder col-centered row-centered" layout="tabular" columns="0">
						<p:row>
							<p:column>
								<h:outputText value="Mes: " for="mesInputOri" />
							</p:column>
							<p:column>
								<p:selectOneMenu id="mesInputOri" size="18" editable="false"
									value="#{eAPEProyectoMB.mes}">
									<f:selectItems value="#{eAPEProyectoMB.listTcMes}" var="meses"
										itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
								</p:selectOneMenu>
							</p:column>
							<p:column>
								<h:outputText value="Proyecto: " for="idFinalidad" />
							</p:column>
							<p:column>
								<p:selectOneMenu id="idFinalidad" size="18" editable="false"
									value="#{eAPEProyectoMB.funcion}">
									<f:selectItems value="#{eAPEProyectoMB.listMuninep}"
										var="muninep" itemValue="#{muninep.campo7}"
										itemLabel="#{muninep.campo7}" />
									<p:ajax event="change"
										listener="#{eAPEProyectoMB.updateName()}"
										update=":form1:namefuncion" />
								</p:selectOneMenu>
							</p:column>
							<p:column>
								<p:commandButton icon="pi pi-play" id="generateportepdf"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()"
									action="#{eAPEProyectoMB.generatePDF}" value="Generar"
									update="form1:visor, :form1:messagesEdit">
								</p:commandButton>
							</p:column>
							<p:column>
								<p:commandLink actionListener="#{eAPEProyectoMB.downloadXls}"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()" id="btnExcel"
									update=":form1:messagesEdit, :form1:downXls" title="EXCEL" styleClass="sg-btn-sm">
									<i class="pi pi-file-excel" /> Excel
								</p:commandLink>
							</p:column>
						</p:row>
					</p:panelGrid>
					<p:inputText value="#{eAPEProyectoMB.nameFuncion}" disabled="true"
						style="text-align:center;" id="namefuncion" size="80" />
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (eAPEProyectoMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
							visible="#{eAPEProyectoMB.uuid ne null}">
							<object type="application/pdf"
								data="#{request.contextPath}/GetFileInline?uuid=#{eAPEProyectoMB.uuid}&amp;filename=#{eAPEProyectoMB.endFilename}"
								height="640px" width="100%"> Tu browser no puede
								desplegar el PDF. </object>
					</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
