<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:commandButton style="display: none" id="downXls" ajax="false"
					update=":form1:growlReportador, :form1:downXls"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{gastoGlobalFuenteMB.fileXls}" />
				</p:commandButton>
				<p:commandButton style="display: none" id="downTxt" ajax="false"
					update=":form1:growlReportador, :form1:downXls"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{gastoGlobalFuenteMB.fileTxt}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Gasto global por fuente del mes</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:messages id="growlReportador" showDetail="true" closable="true" />
					<p:panelGrid columns="13" id="mesPanel"
						styleClass="green col-centered row-centered  ui-noborder" layout="tabular">
						<h:outputText value="Reporte: " for="reporte" />
						<p:selectOneMenu id="reporte"
							value="#{gastoGlobalFuenteMB.reporte}">
							<f:selectItem itemValue="0" itemLabel="Mensual" />
							<f:selectItem itemValue="1" itemLabel="Acumulado" />
						</p:selectOneMenu>
						<h:outputText value="Mes: " for="mes" />
						<p:selectOneMenu id="mes" value="#{gastoGlobalFuenteMB.mes}">
							<f:selectItems value="#{gastoGlobalFuenteMB.listMes}" var="item"
								itemValue="#{item.mes}" itemLabel="#{item.descripcion}" />
						</p:selectOneMenu>
						<h:outputText value="Cuenta: " />
						<p:inputText id="cuenta" size="4" maxlength="4"
							value="#{gastoGlobalFuenteMB.cuenta}">
						</p:inputText>
						<h:outputText value="Partida: " />
						<p:inputText id="partida" size="4" maxlength="4"
							value="#{gastoGlobalFuenteMB.partida}">
						</p:inputText>
						<h:outputText value="Fuente Financiamiento: " />
						<p:inputText id="fuente" size="8" maxlength="8"
							value="#{gastoGlobalFuenteMB.fuenteF}">
						</p:inputText>
						<p:commandButton icon="pi pi-play" id="generateportepdf"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()"
							action="#{gastoGlobalFuenteMB.createPDF}" value="Generar"
							update="form1:visor, :form1:growlReportador">
						</p:commandButton>
						<p:commandLink actionListener="#{gastoGlobalFuenteMB.downlandXLS}"
							update=":form1:growlReportador, :form1:downXls" title="XLS" styleClass="sg-btn-sm">
							<i class="pi pi-file-excel" /> Excel
						</p:commandLink>
						<p:commandLink actionListener="#{gastoGlobalFuenteMB.downlandTXT}"
							update=":form1:growlReportador, :form1:downTxt" title="TXT" styleClass="sg-btn-sm">
							<i class="pi pi-file" /> TXT

						</p:commandLink>

					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (gastoGlobalFuenteMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{gastoGlobalFuenteMB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{gastoGlobalFuenteMB.uuid}&amp;filename=#{gastoGlobalFuenteMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
