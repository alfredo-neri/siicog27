<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<f:metadata>
	<f:viewParam name="reportid" value="#{reportadortxtMB.reportid}" />
</f:metadata>
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<p:growl id="growlReportador" showDetail="false" sticky="true"></p:growl>
			<h:form id="formTable">
				<p:remoteCommand name="onload"
					action="#{reportadortxtMB.initNombreDinamico}" autoRun="true"
					update="panel" />

				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>#{reportadortxtMB.nombreReporte}</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<br />
					<br />
					<p:commandButton id="generareportetxt" style="padding: 3px;"
						action="#{reportadortxtMB.generaReporte}"
						ajax="false"
						value="#{reportadortxtMB.botonLabel}"
						styleClass="btn btn-default">
					</p:commandButton>
					
					<br />
					<br />
					<br />
					<br />
						</div>
					</div>
				</h:panelGroup>
			</h:form>
			<script type="text/javascript">
			    function start() {
			        PF('blockUIWidget').block();
			     }
			 
			     function stop() {
			         PF('blockUIWidget').unblock();
			     }
           </script>

		</ui:define>
	</ui:composition>
</h:body>
</html>
