<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>

				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{reporte55MB.fileXls}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Avance Presupuestal de Egresos por Secretar&iacute;a</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">

					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
						<h:outputText value="Mes: " for="idMes"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />

						<p:selectOneMenu id="idMes" value="#{reporte55MB.mes}">
							<f:selectItems value="#{reporte55MB.listMes}" var="meses"
								itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
						</p:selectOneMenu>
						<h:outputText value="Secretar&iacute;a: " for="idsecretaria"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />

						<!-- <p:selectOneMenu id="idsecretaria"
							value="#{reporte55MB.secretaria}">
							<f:selectItems value="#{reporte55MB.listClvdep}" var="secretaria"
								itemValue="#{secretaria}" itemLabel="#{secretaria}" /> 
						</p:selectOneMenu>-->
						<p:inputText id="idsecretaria" value="#{reporte55MB.secretaria}" maxlength="3" size="3" required="true" requiredMessage="Favor de captura la Secretaría"/>
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">

							<p:commandButton icon="pi pi-play" id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{reporte55MB.viewPdf}" value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>

							<p:commandLink actionListener="#{reporte55MB.downloadXls}"
								update=":form1:downXls, :form1:growlReportador" title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel

							</p:commandLink>

						</p:panelGrid>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (reporte55MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{reporte55MB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{reporte55MB.uuid}&amp;filename=#{reporte55MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
