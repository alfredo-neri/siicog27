<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
			<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado Comparativo de Egresos D</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">				
								<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
									<h:outputText value="Mes: " for="mesInputOri" />
									<p:selectOneMenu id="mesInputOri" size="18" editable="false"
										value="#{rF009118MB.mes}">
										<f:selectItem itemValue="1" itemLabel="01" />
										<f:selectItem itemValue="2" itemLabel="02" />
										<f:selectItem itemValue="3" itemLabel="03" />
										<f:selectItem itemValue="4" itemLabel="04" />
										<f:selectItem itemValue="5" itemLabel="05" />
										<f:selectItem itemValue="6" itemLabel="06" />
										<f:selectItem itemValue="7" itemLabel="07" />
										<f:selectItem itemValue="8" itemLabel="08" />
										<f:selectItem itemValue="9" itemLabel="09" />
										<f:selectItem itemValue="10" itemLabel="10" />
										<f:selectItem itemValue="11" itemLabel="11" />
										<f:selectItem itemValue="12" itemLabel="12" />
									</p:selectOneMenu>
									
									<h:outputText value="Numero de Firmas en el Reporte:" />
									<p:selectOneMenu id="firmaInput" size="5" editable="false" value="#{rF009118MB.firmas}">
										<f:selectItem itemValue="4" itemLabel="4" />
										<f:selectItem itemValue="3" itemLabel="3" />
										<f:selectItem itemValue="2" itemLabel="2" />
										<f:selectItem itemValue="1" itemLabel="1" />
										<f:selectItem itemValue="0" itemLabel="0" />
									</p:selectOneMenu>
						
									<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">

									<p:commandButton icon="pi pi-play" id="generareportepdf"
									    onstart="PF('blockUIWidget').block()"
										oncomplete="PF('blockUIWidget').unblock()"
										action="#{rF009118MB.createFilePdfInline}"
										value="Generar" update="form1:visor, :form1:growlReportador"
										>
									</p:commandButton>
										
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);"
										title="EXCEL" styleClass="sg-btn-sm">
										<i class="pi pi-file-excel" /> Excel
										<p:fileDownload value="#{rF009118MB.fileXls}" />
									</h:commandLink>
									
								
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" styleClass="sg-btn-sm">
										<i class="pi pi-file" /> TXT
										<p:fileDownload value="#{rF009118MB.fileTxtUsingLink}"/>
									</h:commandLink>

								</p:panelGrid>
								</p:panelGrid>
					
					
						

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (rF009118MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"	visible="#{rF009118MB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{rF009118MB.uuid}&amp;filename=#{rF009118MB.endFilename}" height="640px" width="100%">
									Tu browser no puede	desplegar el PDF.
									</object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
