<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{reporteDependeciasTresMB.fileXls}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Avance Presupuestal Global por Dependencia</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
						<h:outputText value="Mes: " for="mesInputOri" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{reporteDependeciasTresMB.mes}">
							<f:selectItems value="#{reporteDependeciasTresMB.listMeses}"
								var="mes" itemValue="#{mes.periodo}" itemLabel="#{mes.periodo}" />
						</p:selectOneMenu>
						<h:outputText value="Dependencia: " for="idDependecia" />
						<p:selectOneMenu id="idDependecia" size="18"
							value="#{reporteDependeciasTresMB.clvDep}">
							<f:selectItems value="#{reporteDependeciasTresMB.listCatdep}"
								var="depe" itemValue="#{depe}" itemLabel="#{depe}" />
							<p:ajax event="change" update=":form1:nomdep"
								listener="#{reporteDependeciasTresMB.changeDependecia}" />
						</p:selectOneMenu>
						<p:panelGrid columns="3" styleClass="ui-noborder" layout="tabular">
							<p:commandButton id="generareportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{reporteDependeciasTresMB.viewPdf}" value="Generar"
								icon="ui-icon-image"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>
							<p:commandLink
								actionListener="#{reporteDependeciasTresMB.downloadXls}"
								update=":form1:growlReportador, :form1:downXls" title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
							</p:commandLink>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT" styleClass="sg-btn-sm">
								<i class="pi pi-file" /> TXT
								<p:fileDownload value="#{reporteDependeciasTresMB.fileTxt}" />
							</h:commandLink>
						</p:panelGrid>
					</p:panelGrid>
					<p:inputText id="nomdep" size="70"
							value="#{reporteDependeciasTresMB.nomDep}" disabled="true" readonly="true" />
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (reporteDependeciasTresMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{reporteDependeciasTresMB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{reporteDependeciasTresMB.uuid}&amp;filename=#{reporteDependeciasTresMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
