<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:c="jakarta.tags.core"
	xmlns:fn="jakarta.tags.functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">

				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{eAPEPoryectoCapituloMB.fileXls}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado de Avance Presupuestal de Egresos Proyecto y capitulos</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:messages id="messagesEdit" showDetail="true" sticky="true"
						closable="true" />
					<p:focus context="proyecto" />
					<p:panelGrid styleClass="ui-noborder col-centered row-centered"
						columns="6" layout="tabular">
						<h:outputText value="Proyecto(s): " for="proyecto" />
						<p:selectOneMenu id="proyecto" size="18" editable="false"
							value="#{eAPEPoryectoCapituloMB.proyecto}">
							<f:selectItems value="#{eAPEPoryectoCapituloMB.proyectos}"
								var="p" itemValue="#{p}" itemLabel="#{p}" />
						</p:selectOneMenu>
						<h:outputText value="Mes: " for="mes" />
						<p:selectOneMenu id="mes" size="18" editable="false"
							value="#{eAPEPoryectoCapituloMB.mes}">
							<f:selectItems value="#{eAPEPoryectoCapituloMB.listTcMes}"
								var="meses" itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
						</p:selectOneMenu>

						<p:commandButton icon="pi pi-play" id="generateportepdf"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()"
							action="#{eAPEPoryectoCapituloMB.generatePDF}" value="Generar"
							update="form1:visor, :form1:messagesEdit">
						</p:commandButton>
						<p:commandLink
							actionListener="#{eAPEPoryectoCapituloMB.downloadXls}"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()" id="btnExcel"
							update=":form1:messagesEdit, :form1:downXls" title="EXCEL" styleClass="sg-btn-sm">
							<i class="pi pi-file-excel" /> Excel
						</p:commandLink>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (eAPEPoryectoCapituloMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{eAPEPoryectoCapituloMB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{eAPEPoryectoCapituloMB.uuid}&amp;filename=#{eAPEPoryectoCapituloMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
