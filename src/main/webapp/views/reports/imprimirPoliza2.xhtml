<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte"
					header="Impresi&oacute;n de P&oacute;lizas"
					styleClass="green col-md-11 col-centered row-centered shadow-panel">
					<p:panelGrid columns="3" styleClass=" col-centered row-centered ">
						<p:outputLabel for="tipoReporte" value="Tipo de Reporte:" />
						<p:selectOneRadio id="tipoReporte"
							value="#{polizaMantenimientoMB3.tipoReporte}" unselectable="true">
							<f:selectItem itemLabel="Tipo A" itemValue="A" />
							<f:selectItem itemLabel="Tipo B" itemValue="B" />

						</p:selectOneRadio>
					</p:panelGrid>
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder">
						<p:panelGrid columns="11" styleClass="ui-noborder">
							<h:outputText value="Mes:" />
							<p:selectOneMenu id="mesInput" value="#{imprimirPolizaMB.mes}">
								<f:selectItems value="#{imprimirPolizaMB.listTcMes}" var="item"
									itemValue="#{item.mes}" itemLabel="#{item.mes}" />
							</p:selectOneMenu>
							<h:outputText value="Tipo:" />
							<p:selectOneMenu id="tipoInput" value="#{imprimirPolizaMB.tipo}">
								<f:selectItems value="#{imprimirPolizaMB.listCattpo}"
									var="itemTpo" itemValue="#{itemTpo.tippol}"
									itemLabel="#{itemTpo.tippol}" />
							</p:selectOneMenu>
							<h:outputText value="P&oacute;liza Inicial:" />
							<p:inputText value="#{imprimirPolizaMB.polIni}" maxlength="6"
								size="6" required="true"
								requiredMessage="El campo P&oacute;liza Inicial es obligatorio">
								<pe:keyFilter regEx="/[\d]/" />
							</p:inputText>
							<h:outputText value="P&oacute;liza Final:" />
							<p:inputText value="#{imprimirPolizaMB.polfin}" maxlength="6"
								size="6" required="true"
								requiredMessage="El campo P&oacute;liza Final es obligatorio">
								<pe:keyFilter regEx="/[\d]/" />
							</p:inputText>
							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{imprimirPolizaMB.createFilePdfInline}"
								value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT">
								<p:graphicImage value="txt.png" width="24" />
								<p:fileDownload value="#{imprimirPolizaMB.txt}" />
							</h:commandLink>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="XLS">
								<p:graphicImage value="excel.png" width="24" />
								<p:fileDownload value="#{imprimirPolizaMB.fileXls}" />
							</h:commandLink>
						</p:panelGrid>
					</p:panelGrid>
					<p:panel id="inlinePdf" style="border:0px"
						visible="#{imprimirPolizaMB.uuid ne null}">
						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{imprimirPolizaMB.uuid}&amp;filename=#{imprimirPolizaMB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>
					</p:panel>
				</p:panel>
				<pe:blockUI widgetVar="blockUIWidget" centerX="false">
					<h:panelGrid columns="2">
						<h:graphicImage value="indice.png"
							style="margin-right: 12px; vertical-align: middle;" />
						<h:outputText value="Por favor espere..."
							style="white-space: nowrap;" />
					</h:panelGrid>
				</pe:blockUI>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
