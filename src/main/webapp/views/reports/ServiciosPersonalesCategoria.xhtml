<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"> <h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Clasificación de Servicios Personales por Categoría</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">

						<p:panelGrid columns="6" styleClass="ui-noborder" layout="tabular">

							<h:outputText value="Reporte: " for="reportOri" />
							<p:selectOneMenu id="reportOri"
								value="#{servPersByCategoriaMB.reporte}">
								<f:selectItem itemLabel="Trimestral" itemValue="T" />
								<f:selectItem itemLabel="Acumulado" itemValue="A" />
							</p:selectOneMenu>

							<h:outputText value="Trimestre: " />
							<p:selectOneMenu value="#{servPersByCategoriaMB.trimestre}">
								<f:selectItems value="#{servPersByCategoriaMB.listTrimestres}"
									var="trim" itemLabel="#{trim.periodo}"
									itemValue="#{trim.periodo}" />
							</p:selectOneMenu>
							
							<p:selectOneMenu id="pesosOri" style="display:none;"
								value="#{servPersByCategoriaMB.pesos}">
								<f:selectItem itemLabel="Pesos" itemValue="1" />
							</p:selectOneMenu>

							<p:commandButton id="generareportetxt"
								value="Generar Archivo TXT" ajax="false"
								styleClass="btn btn-default" update=":form1:growlReportador"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{servPersByCategoriaMB.file}" />
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body> </html>
