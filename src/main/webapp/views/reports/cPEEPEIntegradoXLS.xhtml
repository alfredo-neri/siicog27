<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado Anal&iacute;tico de Egreso Presupuestal Integrado</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">

						<p:panelGrid columns="5" styleClass="ui-noborder" layout="tabular">

							<h:outputText value="Mes: " for="mesInputOri" />
							<p:selectOneMenu id="idmes" value="#{cPEEPEIntegradoXLSMB.mes}">
								<f:selectItems value="#{cPEEPEIntegradoXLSMB.listMes}"
									var="meses" itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
							</p:selectOneMenu>

							<p:commandButton icon="pi pi-play" value="Generar" ajax="false"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{cPEEPEIntegradoXLSMB.fileXls}" />
							</p:commandButton>


							<!-- 	<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);"
										title="EXCEL">
										<p:graphicImage value="excel.png" width="24" />
										<p:fileDownload value="#{cPEEPEIntegradoXLSMB.fileXls}" />
										<p:inputText type="hidden" value="#{cPEEPEIntegradoXLSMB.typeFile = 1}"/>
									</h:commandLink> 
 -->
							<!-- 									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{cPEEPEIntegradoXLSMB.fileCsv}" />
									</h:commandLink>
									
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" >
										<p:graphicImage value="txt.png" width="24" />
										<p:fileDownload value="#{cPEEPEIntegradoXLSMB.fileTxt}"/>
									</h:commandLink>
									
									 -->
							<!-- 
							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{cPEEPEIntegradoXLSMB.createFilePdfInline}"
								value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton> -->

						</p:panelGrid>
					</p:panelGrid>



				
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (cPEEPEIntegradoXLSMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{cPEEPEIntegradoXLSMB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{cPEEPEIntegradoXLSMB.uuid}&amp;filename=#{cPEEPEIntegradoXLSMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>

			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
