<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>ESTADO ANAL&Iacute;TICO DEL EJERCICIO DE PRESUPUESTO DE EGRESOS CLASIFICACI&Oacute;N POR OBJETO DE GASTO (Capitulo y Concepto)</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">

					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">

						<h:outputText value="Mes: " for="mesInputOri" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{rF001029MB.mes}">
							<f:selectItems value="#{rF001029MB.listMes}" var="meses"
								itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
							<p:ajax event="change" listener="#{rF001029MB.validateMonth}"
								update=":form1:growlReportador" />
						</p:selectOneMenu>
						<h:outputText value="Saldo 0: " for="mesInputOri" />
						<p:selectOneMenu id="saldo0" size="18" editable="false"
							value="#{rF001029MB.saldo0}">
							<f:selectItem itemValue="0" itemLabel="No" />
							<f:selectItem itemValue="1" itemLabel="Si" />
						</p:selectOneMenu>

						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">

							<p:commandButton icon="pi pi-play" id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{rF001029MB.createFilePdfInline}" value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>

							<!-- <h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" >
										<p:graphicImage value="txt.png" width="24" />
										<p:fileDownload value="#{rF001029MB.fileTxt}"/>
									</h:commandLink> -->

							<!-- 									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{rF001029MB.fileCsv}" />
									</h:commandLink>
									
									 -->

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{rF001029MB.fileXls}" />
							</h:commandLink>

							<p:commandButton id="downTxt" ajax="false" value="Archivo TXT"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{rF001029MB.txtFile}" />
							</p:commandButton>

						</p:panelGrid>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (rF001029MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{rF001029MB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{rF001029MB.uuid}&amp;filename=#{rF001029MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
