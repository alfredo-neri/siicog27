<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<!--
				SIICOG fase 2: estructura del prototipo (sicog-pantallas.html, "Reporte de Balanza de Comprobación").
				Se conservan componentes, ids, valores y listeners de difem26. "Cuentas con saldo 0" sigue siendo
				lista (N/S ahora dice No/Sí): el bean no trae valor inicial y la lista siempre envía "0". El reporte sigue siendo el PDF que arma el bean; se muestra en
				el visor oscuro del prototipo. El update del boton apunta al visor, que siempre existe y contiene
				a inlinePdf y al aviso de "sin reporte" (antes update="form1:inlinePdf").
			-->
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>

				<!-- el bean lo pulsa por JavaScript (#form1:downXls) despues de validar el mes -->
				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{rF00914MB.fileXls}" />
				</p:commandButton>

				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page">
					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Reporte de Balanza de Comprobación</h1>
						</div>
					</div>

					<div class="sg-card">
						<div class="sg-card-h">
							<div class="sg-actions" style="gap: 16px; align-items: flex-end;">
								<div class="sg-field">
									<p:outputLabel for="mesInputOri" value="Mes" />
									<p:selectOneMenu id="mesInputOri" editable="false" style="min-width: 150px;"
										value="#{rF00914MB.mes}">
										<f:selectItem itemValue="1" itemLabel="01 · Enero" />
										<f:selectItem itemValue="2" itemLabel="02 · Febrero" />
										<f:selectItem itemValue="3" itemLabel="03 · Marzo" />
										<f:selectItem itemValue="4" itemLabel="04 · Abril" />
										<f:selectItem itemValue="5" itemLabel="05 · Mayo" />
										<f:selectItem itemValue="6" itemLabel="06 · Junio" />
										<f:selectItem itemValue="7" itemLabel="07 · Julio" />
										<f:selectItem itemValue="8" itemLabel="08 · Agosto" />
										<f:selectItem itemValue="9" itemLabel="09 · Septiembre" />
										<f:selectItem itemValue="10" itemLabel="10 · Octubre" />
										<f:selectItem itemValue="11" itemLabel="11 · Noviembre" />
										<f:selectItem itemValue="12" itemLabel="12 · Diciembre" />
									</p:selectOneMenu>
								</div>
								<div class="sg-field">
									<p:outputLabel for="saldosInputOri" value="Cuentas con saldo 0" />
									<p:selectOneMenu id="saldosInputOri" editable="false" style="min-width: 110px;"
										value="#{rF00914MB.saldo0}">
										<f:selectItem itemValue="0" itemLabel="No" />
										<f:selectItem itemValue="1" itemLabel="Sí" />
									</p:selectOneMenu>
								</div>
								<p:commandButton id="generareportepdf" icon="pi pi-play"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()"
									action="#{rF00914MB.viewPdf}" value="Generar"
									update=":form1:visor, :form1:growlReportador">
								</p:commandButton>
							</div>
							<div class="sg-export" style="align-self: flex-end;">
								<p:commandLink actionListener="#{rF00914MB.downloadXls}" styleClass="sg-btn-sm"
									update=":form1:growlReportador, :form1:downXls" title="EXCEL">
									<i class="pi pi-file-excel" /> Excel
								</p:commandLink>
								<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);" styleClass="sg-btn-sm"
									title="TXT">
									<i class="pi pi-file" /> TXT
									<p:fileDownload value="#{rF00914MB.fileTxt}" />
								</h:commandLink>
							</div>
						</div>

						<!-- ===== Visor del reporte ===== -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{rF00914MB.uuid eq null}">
								<i class="pi pi-file-pdf" />
								<span>Elige el mes y pulsa <b>Generar</b> para ver la balanza.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{rF00914MB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{rF00914MB.uuid}&amp;filename=#{rF00914MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
