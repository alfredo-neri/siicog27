<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
    <h:outputScript library="js" name="txtMatrizInd.js" />
			<h:form id="form1">

				<p:growl id="growlReportador" showDetail="true" sticky="true" />

				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Matriz de Indicadores-Genera TXT</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder"
						id="p1" layout="tabular">
						<p:panelGrid columns="4" styleClass="ui-noborder" id="pButtons" layout="tabular">

							<p:commandButton value="Generar" icon="ui-icon-arrowthick-1-s"
								actionListener="#{txtMatrizIndMB.process}"
								oncomplete="triggerDownload()" update="form1">
							</p:commandButton>

							<p:commandButton value="Generar" ajax="false" id="correcto" widgetVar="downbtn"
								onclick="PrimeFaces.monitorDownload(start, stop);"
								actionListener="#{txtMatrizIndMB.downLoadFile}"
								icon="ui-icon-arrowthick-1-s" style="display: none">
								<p:fileDownload value="#{txtMatrizIndMB.fileTxt}" />
 							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
