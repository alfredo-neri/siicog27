<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>

				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Diario General de Pólizas</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="6" styleClass="col-centered ui-noborder" layout="tabular">
						
						<h:outputText value="Mes Inicial: " for="mesInicial" />
						<p:selectOneMenu id="mesInicial"
							value="#{diarioGeneralPolizasMunicipalMB.mesInicial}">
							<f:selectItems
								value="#{diarioGeneralPolizasMunicipalMB.listMes}" var="item"
								itemValue="#{item.periodo}" itemLabel="#{item.periodo}" />
						</p:selectOneMenu>
						
						<h:outputText value="Mes Final: " for="mesFinal" />
						<p:selectOneMenu id="mesFinal"
							value="#{diarioGeneralPolizasMunicipalMB.mesFinal}">
							<f:selectItems
								value="#{diarioGeneralPolizasMunicipalMB.listMes}" var="item"
								itemValue="#{item.periodo}" itemLabel="#{item.periodo}" />
						</p:selectOneMenu>
						
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
							<p:commandButton icon="pi pi-play" id="generareportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{diarioGeneralPolizasMunicipalMB.viewPdf}" value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="XLS" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{diarioGeneralPolizasMunicipalMB.fileXls}" />
							</h:commandLink>
						</p:panelGrid>
					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (diarioGeneralPolizasMunicipalMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{diarioGeneralPolizasMunicipalMB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{diarioGeneralPolizasMunicipalMB.uuid}&amp;filename=#{diarioGeneralPolizasMunicipalMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
