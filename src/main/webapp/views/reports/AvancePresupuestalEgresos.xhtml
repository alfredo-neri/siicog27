<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Avance Presupuestal de Egresos por Estructura Program&aacute;tica</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
						<p:outputLabel value="Mes: " for="mesInputOri" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{avancePresupuestalEgresosMB.mes}">
							<f:selectItems var="mes"
								value="#{avancePresupuestalEgresosMB.listMeses}"
								itemLabel="#{mes.periodo}" itemValue="#{mes.periodo}" />
						</p:selectOneMenu>
						<h:panelGrid columns="2" cellpadding="5">
							<p:outputLabel for="city" value="Reporte por: " />
							<p:selectOneRadio id="city" layout="responsive" columns="1"
								value="#{avancePresupuestalEgresosMB.tipoReporte}">
								<f:selectItem itemLabel="Fin - Fun" itemValue="4" />
								<f:selectItem itemLabel="8 Caracteres" itemValue="8" />
								<f:selectItem itemLabel="12 Caracteres" itemValue="12" />
							</p:selectOneRadio>
						</h:panelGrid>
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{avancePresupuestalEgresosMB.fileXls}" />
							</h:commandLink>
						</p:panelGrid>
					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (avancePresupuestalEgresosMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Aquí se mostrará el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{avancePresupuestalEgresosMB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{avancePresupuestalEgresosMB.uuid}&amp;filename=#{avancePresupuestalEgresosMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
