<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Cuenta y partida al mes</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:focus context="panelControles" />
					<p:panelGrid styleClass="col-centered ui-noborder"
						id="panelControles" layout="tabular" columns="0">
						<p:row>
							<p:column colspan="3">
							</p:column>
							<p:column style="text-align: center;">
								<h:outputText value="Inicial" />
							</p:column>
							<p:column style="text-align: center;">
								<h:outputText value="Final" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Cuenta: " for="CuentaInput" />
							</p:column>
							<p:column>
								<p:inputText id="CuentaInput"
									value="#{reporte91GraficoMB.cuenta}" required="true"
									requiredMessage="El campo Cuenta no debe de ir vacío"
									maxlength="4" size="4">
									<p:keyFilter mask="pint" />
								</p:inputText>
							</p:column>
							<p:column>
								<h:outputText value="Partida(Nat. Gasto): "
									for="PartidaInicialInput" />
							</p:column>
							<p:column>
								<p:inputText id="PartidaInicialInput"
									value="#{reporte91GraficoMB.partidaInicial}" maxlength="4"
									size="4">
									<p:keyFilter mask="pint" />
								</p:inputText>
							</p:column>
							<p:column>
								<p:inputText id="PartidaFinalInput"
									value="#{reporte91GraficoMB.partidaFinal}" maxlength="4"
									size="4">
									<p:keyFilter mask="pint" />
								</p:inputText>
							</p:column>
							<p:column colspan="0" style="text-align: center;">
								<p:commandButton icon="pi pi-play" id="generateportepdf"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()"
									action="#{reporte91GraficoMB.viewPdf}" value="Generar"
									update="form1:visor, :form1:growlReportador">
								</p:commandButton>

								<h:commandLink
									onclick="PrimeFaces.monitorDownload(start, stop);"
									title="EXCEL" styleClass="sg-btn-sm">
									<i class="pi pi-file-excel" /> Excel
									<p:fileDownload value="#{reporte91GraficoMB.fileXls}" />
								</h:commandLink>

							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="3" style="text-align: right;">
								<h:outputText value="Mes: " for="mesInputOri" />
							</p:column>
							<p:column>
								<p:selectOneMenu id="mesInputOri"
									value="#{reporte91GraficoMB.mesIni}">
									<f:selectItems value="#{reporte91GraficoMB.listMes}"
										var="meses" itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
									<p:ajax event="change"
										listener="#{reporte91GraficoMB.validateMonthInit}"
										update=":form1:growlReportador" />
								</p:selectOneMenu>
							</p:column>
							<p:column>
								<p:selectOneMenu id="mesFInOri"
									value="#{reporte91GraficoMB.mesFin}">
									<f:selectItems value="#{reporte91GraficoMB.listMes}" var="mes"
										itemValue="#{mes.mes}" itemLabel="#{mes.mes}" />
									<p:ajax event="change"
										listener="#{reporte91GraficoMB.validateMonthEnd}"
										update=":form1:growlReportador" />
								</p:selectOneMenu>
							</p:column>

						</p:row>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (reporte91GraficoMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{reporte91GraficoMB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{reporte91GraficoMB.uuid}&amp;filename=#{reporte91GraficoMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>

			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
