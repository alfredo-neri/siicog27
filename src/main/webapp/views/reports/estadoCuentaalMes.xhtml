<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado de Cuenta al Mes</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="12" styleClass="col-centered ui-noborder" layout="tabular">
						<div class="row">
							<div class="col-md-2" />
							<h:panelGrid columns="9" id="panel-filtros">
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Cuenta" for="CuentaInput" />
									<p:inputText id="CuentaInput" style="width: 4em;"
										value="#{estadoCuentaAlMesMB.cuenta}" maxlength="4"
										required="true" requiredMessage="Ingrese la Cuenta">
										<p:ajax event="change" process="@this form1:CuentaInput" />
									</p:inputText>
								</h:panelGrid>
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Scta" for="SctaInput" />
									<p:inputText id="SctaInput" style="width: 10em;"
										value="#{estadoCuentaAlMesMB.scta}" maxlength="15">
										<p:ajax event="change"
											listener="#{estadoCuentaAlMesMB.leftPad}"
											update="form1:panel-filtros" />
									</p:inputText>
								</h:panelGrid>
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Sscta" for="SsctaInput" />
									<p:inputText id="SsctaInput" style="width: 11em;"
										value="#{estadoCuentaAlMesMB.sscta}" maxlength="18">
										<p:ajax event="change"
											listener="#{estadoCuentaAlMesMB.leftPad}"
											update="form1:panel-filtros" />
									</p:inputText>
								</h:panelGrid>
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Ssscta" for="SssctaInput" />
									<p:inputText id="SssctaInput" style="width: 4em;"
										value="#{estadoCuentaAlMesMB.ssscta}" maxlength="4">
										<p:ajax event="change"
											listener="#{estadoCuentaAlMesMB.leftPad}"
											update="form1:panel-filtros" />
									</p:inputText>
								</h:panelGrid>
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Sssscta" for="SsssctaInput" />
									<p:inputText id="SsssctaInput" style="width: 4em;"
										value="#{estadoCuentaAlMesMB.sssscta}" maxlength="4">
										<p:ajax event="change"
											listener="#{estadoCuentaAlMesMB.leftPad}"
											update="form1:panel-filtros" />
									</p:inputText>
								</h:panelGrid>
								<h:panelGrid columns="1" columnClasses="text-left">
									<h:outputText value="Mes" for="mesInputOri" />
									<p:selectOneMenu id="mesInputOri" size="18" editable="false"
										value="#{estadoCuentaAlMesMB.mes}">
										<f:selectItems value="#{estadoCuentaAlMesMB.listMeses}"
											var="m" itemValue="#{m.periodo}" itemLabel="#{m.periodo}" />
									</p:selectOneMenu>
								</h:panelGrid>
								<h:panelGrid columns="2" columnClasses="borderless"
									style="margin-left: 18px;">
									<h:panelGrid columns="2" columnClasses="borderless">
										<p:selectOneRadio layout="responsive" columns="1"
											value="#{estadoCuentaAlMesMB.orderBy}" required="true">
											<f:selectItem itemLabel="Por fecha" itemValue="FECPOL" />
											<f:selectItem itemLabel="Por referencia" itemValue="REFPOL" />
											<f:selectItem itemLabel="Por mes" itemValue="MESPOL" />
											<p:ajax event="change" update="filtroExtenso" />
										</p:selectOneRadio>
									</h:panelGrid>
									<h:inputText id="filtroExtenso" disabled="true"
										style="width: 7em; margin-left: .5em;"
										value="#{estadoCuentaAlMesMB.orderBy == 'FECPOL' ? 'FECHA' : (estadoCuentaAlMesMB.orderBy == 'REFPOL' ? 'REFERENCIA' : 'MES')}" />
								</h:panelGrid>
							</h:panelGrid>
							<p:commandButton icon="pi pi-play" id="generareportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{estadoCuentaAlMesMB.createFilePdfInline}"
								value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{estadoCuentaAlMesMB.fileXls}" />
							</h:commandLink>
							<!-- h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								styleClass="btn btn-default" title="TXT" value="Correcto">
								<p:fileDownload value="#{estadoCuentaAlMesMB.filePdf}" />
							</h:commandLink> -->
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT" styleClass="sg-btn-sm">
								<i class="pi pi-file" /> TXT
								<p:fileDownload value="#{estadoCuentaAlMesMB.fileTxt}" />
							</h:commandLink>
						</div>
					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (estadoCuentaAlMesMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{estadoCuentaAlMesMB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{estadoCuentaAlMesMB.uuid}&amp;filename=#{estadoCuentaAlMesMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
