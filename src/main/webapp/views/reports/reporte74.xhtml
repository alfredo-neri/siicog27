<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Mov. del Mil al Mes</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">

					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
						<h:outputText value="Mes: " for="idMes"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />

						<p:selectOneMenu id="idMes" value="#{reporte74MB.mes}">
							<f:selectItems value="#{reporte74MB.listMes}" var="meses"
								itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
						</p:selectOneMenu>
						<h:outputText value="Scta: " for="idscta"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />
						<p:inputText id="idscta" size="15" maxlength="15"
							value="#{reporte74MB.scta}" required="true"
							requiredMessage="El campo Scta es obligatorio" />
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">

							<p:commandButton
								onclick="PrimeFaces.monitorDownload(start, stop);"
								value="Generar" ajax="false" icon="ui-icon-document">
								<p:fileDownload value="#{reporte74MB.fileTxt}" />
							</p:commandButton>


							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="xls" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{reporte74MB.fileXls}" />
							</h:commandLink>

						</p:panelGrid>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
