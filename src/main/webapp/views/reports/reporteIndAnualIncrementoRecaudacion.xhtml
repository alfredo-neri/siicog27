<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:param name="bean" value="#{reporteIndAnualIncrementoRecaudacionMB}"></ui:param>
		<ui:define name="content">
		
	        
			<h:form id="form1">
				<p:remoteCommand name="onload"
					action="#{bean.onPageLoad}"
					update=":form1:arteCulturaTable" />
					
				<p:growl id="growlArteCultura" showDetail="false" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Incremento en la Recaudación</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					
							<p:dataTable id="arteCulturaTable" var="artecultura"
								value="#{bean.masterList}"
								styleClass="et_datatable" emptyMessage="No hay registros"
								paginator="true" rows="1"
								paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink}"
								widgetVar="programsWdg" paginatorPosition="top"
								rowIndexVar="rowIndex">
		
								<p:ajax event="page"
									listener="#{bean.cambiarPagina}"
									process="arteCulturaTable"
									update=":form1:arteCulturaTable"></p:ajax>
		
								<p:column>
									<center>
										<p:panelGrid columns="3" styleClass="noBorders" columnClasses="column20,column20,column60" layout="tabular">
											<h:outputLabel value=""></h:outputLabel>
											<h:outputLabel value="Anual"></h:outputLabel>
											<p:inputText id="anual" value="#{artecultura.anual}" size="7"
												maxlength="4" disabled="true"/>
		
											<h:outputLabel value=""></h:outputLabel>
											<h:outputLabel value="Cantidad"></h:outputLabel>
											<h:outputLabel value="Observaciones" ></h:outputLabel>
		
											<h:outputLabel value="Recaudacion total anual (Ingresos ordinarios)"></h:outputLabel>
											<p:inputNumber id="canEveCult" value="#{artecultura.rta}" disabled="#{bean.camposDeshabilitados}"
												decimalPlaces="2" decimalSeparator="." thousandSeparator="," maxlength="13" />
											<p:inputText id="obsEveCult"
												value="#{artecultura.obsrta}"
												size="80" disabled="#{bean.camposDeshabilitados}" maxlength="350" />
											<h:outputLabel
												value="Recaudación total del año anterior (Ingresos ordinarios)"></h:outputLabel>
											<p:inputNumber id="canEveCultAsistentes" value="#{artecultura.rtaa}" disabled="#{bean.camposDeshabilitados}"
												decimalPlaces="2" decimalSeparator="." thousandSeparator="," maxlength="13" />												
											<p:inputText id="obsEveCultAsistentes"
												value="#{artecultura.obsrtaa}"
												size="80"  disabled="#{bean.camposDeshabilitados}" maxlength="350" />
										</p:panelGrid>
		
							<p:panel id="pnlBotones" styleClass="col-centered row-centered noBorders" >
									<p:commandButton value="Salvar"
										action="#{bean.salvar()}"
										rendered="#{bean.botonVisibleSalvar}"
										update="arteCulturaTable,form1:growlArteCultura,pnlBotones" icon="ui-icon-disk"></p:commandButton>
									<p:commandButton value="Modificar"
										action="#{bean.modificar()}"
										rendered="#{bean.botonVisibleModificar}"
										update="arteCulturaTable,form1:growlArteCultura,pnlBotones" icon="ui-icon-pencil"></p:commandButton>
									<p:commandButton value="Limpiar"
										action="#{bean.reset()}"
										disabled="#{bean.botonDeshabilitadoReset}"
										update="arteCulturaTable,form1:growlArteCultura,pnlBotones" icon="ui-icon-tag"></p:commandButton>
									<p:commandButton value="Adicionar"
										action="#{bean.adicionar()}"
										disabled="#{bean.botonDeshabilitadoAdicionar}"
										update="arteCulturaTable,form1:growlArteCultura,pnlBotones"
										oncomplete="PF('programsWdg').getPaginator().setPage(PF('programsWdg').paginator.cfg.pageCount-1);" icon="ui-icon-circle-plus"></p:commandButton>
									<p:commandButton value="Borrar"
										onclick="PF('confirmFileDeleteDiseno').show();"
										disabled="#{bean.botonDeshabilitadoBorrar}">
										<p:confirmDialog widgetVar="confirmFileDeleteDiseno"
											message="¿Desea borrar el registro actual?"
											header="Confirmacion" severity="alert">
											<p:commandButton value="SI" label="SI"
												actionListener="#{bean.borrar()}"
												onclick="PF('confirmFileDeleteDiseno').hide();"
												styleClass="ui-confirmdialog-yes" icon="ui-icon-check"
												update=":form1:arteCulturaTable, form1:growlArteCultura,pnlBotones" />
											<p:commandButton value="NO" label="NO"
												
												onclick="PF('confirmFileDeleteDiseno').hide();"
												styleClass="ui-confirmdialog-yes" icon="ui-icon-check"
												update=":form1:arteCulturaTable, form1:growlArteCultura,pnlBotones" />
										</p:confirmDialog>
									</p:commandButton>
									<p:commandButton value="Cancelar"
										action="#{bean.cancelar()}" immediate="true"
										disabled="#{bean.botonDeshabilitadoCancelar}"
										update=":form1:arteCulturaTable, form1:growlArteCultura,pnlBotones" icon="ui-icon-circle-close"></p:commandButton>
								</p:panel>
									</center>
								</p:column>
							</p:dataTable>

					<br/><br/>
						<p:commandButton value="Generar" id="correcto"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								icon="ui-icon-circle-arrow-s"
								update="form1:visor, :form1:panelReporte, :form1:growlArteCultura"
								actionListener="#{bean.createFilePdfInlineValidate}" />
	
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (bean.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{bean.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{bean.uuid}&amp;filename=#{bean.endFilename}"
									height="640px" width="100%"> Tu browser no puede desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
