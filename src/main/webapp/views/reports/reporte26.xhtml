<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte" header="Inventario de Bienes Inmuebles"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">

					<p:panelGrid columns="3" styleClass="col-centered ui-noborder">
						<h:outputText value="Semestre: " for="idsem"
							style="padding-left: 30px; padding-right: 10px; margin-top: 30px;" />
						<p:selectOneMenu id="idsem" value="#{reporte26MB.sem}">
							<f:selectItem itemValue="1" itemLabel="01" />
							<f:selectItem itemValue="2" itemLabel="02" />
						</p:selectOneMenu>

						<p:panelGrid columns="4" styleClass="ui-noborder">

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL">
								<p:graphicImage value="excel.png" width="24" />
								<p:fileDownload value="#{reporte26MB.fileXls}" />
							</h:commandLink>

							<!-- 	<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{reporte26MB.fileCsv}" />
									</h:commandLink>
									
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" >
										<p:graphicImage value="txt.png" width="24" />
										<p:fileDownload value="#{reporte26MB.fileTxt}"/>
									</h:commandLink>
									
									 -->


							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{reporte26MB.createFilePdfInline}" value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>
							<p:commandButton value="TXT" ajax="false"
								onclick="PrimeFaces.monitorDownload(start, stop);"
								icon="ui-icon-arrowthick-1-s"
								actionListener="#{reporte26MB.downLoadFile}">
								<p:fileDownload value="#{reporte26MB.reporte27mb.fileTxt}" />
							</p:commandButton>

						</p:panelGrid>
					</p:panelGrid>



					<p:panel id="inlinePdf" style="border:0px"
						visible="#{reporte26MB.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{reporte26MB.uuid}&amp;filename=#{reporte26MB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>

				</p:panel>
				<pe:blockUI widgetVar="blockUIWidget" centerX="false">
					<h:panelGrid columns="2">
						<h:graphicImage value="indice.png"
							style="margin-right: 12px; vertical-align: middle;" />
						<h:outputText value="Por favor espere..."
							style="white-space: nowrap;" />
					</h:panelGrid>
				</pe:blockUI>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
