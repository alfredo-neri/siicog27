<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">

				<p:commandButton style="display: none" id="downTxt" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload value="#{comparativoEgresosProgramaMB.fileTxt}" />
				</p:commandButton>

				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Comparativo Egresos  Global Programa</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">


					<p:panelGrid columns="9" styleClass="col-centered ui-noborder" layout="tabular">


						<h:outputText value="Mes: " for="mesInputOri" />

						<p:selectOneMenu id="idMes"
							value="#{comparativoEgresosProgramaMB.mes}">
							<f:selectItems value="#{comparativoEgresosProgramaMB.listMes}"
								var="meses" itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
						</p:selectOneMenu>




						<h:outputText value="Programa: " for="ProgramaInputOri" />

						<p:selectOneMenu id="idPro"
							value="#{comparativoEgresosProgramaMB.programa}">
							<f:selectItems
								value="#{comparativoEgresosProgramaMB.listPrograma}"
								var="programa" itemValue="#{programa.clvpro}"
								itemLabel="#{programa.clvpro}" />
							<p:ajax event="change"
								listener="#{comparativoEgresosProgramaMB.updateNom}"
								update=":form1:nompro"></p:ajax>
						</p:selectOneMenu>


						<h:outputText value="No.Firmas: " for="FirmasInputOri" />
						<p:selectOneMenu id="idFirmas"
							value="#{comparativoEgresosProgramaMB.nfirmas}">
							<f:selectItems
								value="#{comparativoEgresosProgramaMB.listNFirmas}"
								var="nfirmas" itemValue="#{nfirmas}" itemLabel="#{nfirmas}" />
						</p:selectOneMenu>





						<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
							title="TXT" styleClass="sg-btn-sm">
							<i class="pi pi-file" /> TXT
							<p:fileDownload
								value="#{comparativoEgresosProgramaMB.downloadTxt()}" />
						</h:commandLink>


						<p:commandButton id="generareportepdf"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()"
							action="#{comparativoEgresosProgramaMB.viewPdf()}"
							value="Vista Previa"
							update="form1:visor, :form1:growlReportador"
							styleClass="btn btn-default">
						</p:commandButton>


					</p:panelGrid>
					

					<p:inputText id="nompro"
						value="#{comparativoEgresosProgramaMB.nomPro}" disabled="true"
						size="70" />




						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (comparativoEgresosProgramaMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Vista Previa</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{comparativoEgresosProgramaMB.uuid ne null}">

								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{comparativoEgresosProgramaMB.uuid}&amp;filename=#{comparativoEgresosProgramaMB.endFilename}"
									height="640px" width="100%"> </object>

							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
