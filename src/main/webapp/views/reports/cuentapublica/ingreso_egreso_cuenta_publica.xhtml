<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="msgs" showDetail="true" sticky="true"></p:growl>
				<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
					<p:commandButton id="generateportepdfBalance"
						onstart="PF('blockUIWidget').block()"
						oncomplete="PF('blockUIWidget').unblock()"
						actionListener="#{cpBalancePresupuestarioMB.createFilePdfInline}"
						value="Correcto" update="form1:inlinePdfBalnce, :form1:msgs">
					</p:commandButton>
				</p:panelGrid>
				<p:panel id="inlinePdfBalnce" style="border:0px"
					visible="#{cpBalancePresupuestarioMB.uuid ne null}">
					<object type="application/pdf"
						data="#{request.contextPath}/GetFileInline?uuid=#{cpBalancePresupuestarioMB.uuid}&amp;filename=#{cpBalancePresupuestarioMB.endFilename}"
						height="380px" width="100%"> Tu browser no puede
						desplegar el PDF. </object>
				</p:panel>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
