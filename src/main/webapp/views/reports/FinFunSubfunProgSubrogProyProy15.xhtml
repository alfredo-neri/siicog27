<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:c="jakarta.tags.core"
	xmlns:fn="jakarta.tags.functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				
				<p:commandButton style="display: none" id="downXls" ajax="false"
					onclick="PrimeFaces.monitorDownload(start, stop);">
					<p:fileDownload
						value="#{FinFunSubfunProgSubprogProyProy15MB.fileXls}" />
				</p:commandButton>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Estado de Avance Presupuestal de Egresos por Finalidad/Función/Subfunción/Programa/Subprograma/Proyecto/Proyecto 15 caracteres</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:messages id="messagesEdit" showDetail="true" sticky="true" closable="true"/>
					<p:focus context="tipo" />
					<p:panelGrid styleClass="ui-noborder col-centered row-centered"
						columns="4" layout="tabular">
						<h:outputText value="Tipo: " for="tipo" />
						<h:outputText value="Mes: " for="mes" />
						<h:outputText value="" />
						<h:outputText value="" />
						<p:selectOneMenu id="tipo" size="18" editable="false"
							value="#{FinFunSubfunProgSubprogProyProy15MB.key}">
							<f:selectItems
								value="#{FinFunSubfunProgSubprogProyProy15MB.tipos}" var="t"
								itemValue="#{t}" itemLabel="#{fn:substring(t,2,fn:length(t))}" />
						</p:selectOneMenu>
						<p:selectOneMenu id="mes" size="18" editable="false"
							value="#{FinFunSubfunProgSubprogProyProy15MB.mes}">
							<f:selectItems
								value="#{FinFunSubfunProgSubprogProyProy15MB.listTcMes}"
								var="meses" itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
						</p:selectOneMenu>

						<p:commandButton icon="pi pi-play" id="generateportepdf"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()"
							action="#{FinFunSubfunProgSubprogProyProy15MB.generatePDF}"
							value="Generar" update="form1:visor, :form1:messagesEdit">
						</p:commandButton>
						<p:commandLink
							actionListener="#{FinFunSubfunProgSubprogProyProy15MB.downloadXls}"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()" id="btnExcel"
							update=":form1:messagesEdit, :form1:downXls" title="EXCEL" styleClass="sg-btn-sm">
							<i class="pi pi-file-excel" /> Excel
						</p:commandLink>
					</p:panelGrid>

						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (FinFunSubfunProgSubprogProyProy15MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{FinFunSubfunProgSubprogProyProy15MB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{FinFunSubfunProgSubprogProyProy15MB.uuid}&amp;filename=#{FinFunSubfunProgSubprogProyProy15MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
