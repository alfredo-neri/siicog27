<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:param name="bean" value="#{movimientosDeudaMB}"></ui:param>
		<ui:define name="content">
			<script>
				$(document).ready(()=>{
					$(PrimeFaces.escapeClientId('form1:panelReporte')).parents('.container-fluid:first').css('text-align','center');
				})
			</script>
	        <style>
	        span.input-number-small input{
				width:50%;
			}
	         th.header-pull-left{
	             text-align:left !important;
	         }
	         th.header-pull-left span{
	             margin-left: -10px;;
	         }
	         .headerBorder .ui-panel-titlebar{
	             margin-top: -26px;
			    background-color: transparent !important;
			    border: none;
			    text-align: center;
			    font-size: 15px;
	         }
	         .headerBorder .ui-panel-title{
	         	background-color: white;
	         }
	         td.text-left{
	         	padding-left: 10px;
	         }
	         table.ui-selectoneradio {
	         	width:14em;
	         }
	         table.ui-selectoneradio tr:nth-child(2) label{
	             margin-left: -0.3em;
	         }
	         table.ui-selectoneradio label{
	         }
	         .ui-panelgrid-cell{
	         	padding:0px;
	         }
	        </style>
			<h:form id="form1" style="display: inline-block; margin-left: auto; margin-right: auto; ">
				<p:growl id="growlReportador" showDetail="true" sticky="true"><p:autoUpdate/></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Consulta de cargos/abonos de cuentas</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<div class="col-md-12">
						<div class="row">
							<h:panelGrid columns="2" id="panel-filtros" style="">
								<h:panelGrid columns="2" columnClasses="borderless">
									<h:outputText value="Clasificación"/>
									<h:panelGrid columns="1" columnClasses="borderless">
										<p:selectOneRadio layout="responsive" columns="1" value="#{bean.clasificacion}" required="true">
							  	  	  		<f:selectItem itemLabel="Car/Abo cuenta del mes" itemValue="DEL_MES"/>
							  	  	  		<f:selectItem itemLabel="Car/Abo cuenta al mes" itemValue="AL_MES"/>
							  	  	  	</p:selectOneRadio>
						  	  	  	</h:panelGrid>	
					  	  	  	</h:panelGrid>	
								<p:panelGrid styleClass="ui-noborder" layout="tabular" columns="0">
									<p:row>
										<p:column>
											<h:outputText value="Cuenta"/>
										</p:column>
										<p:column>
											<h:outputText value="Scta"/>
										</p:column>
										<p:column>
											<h:outputText value="Sscta"/>
										</p:column>
										<p:column>
											<h:outputText value="Ssscta"/>
										</p:column>
										<p:column>
											<h:outputText value="Sssscta"/>
										</p:column>
										<p:column>
											<h:outputText value="Mes"/>
										</p:column>
										<p:column>
											<p:spacer></p:spacer>
										</p:column>
									</p:row>
									<p:row>
										<p:column>
											<p:inputText id="CuentaInput" style="width: 4em;" value="#{bean.cuenta.cuenta}" maxlength="4">
												<p:ajax event="change" process="@this form1:CuentaInput"/>
											</p:inputText>
										</p:column>
										<p:column>
											<p:inputText id="SctaInput" style="width: 10em;" value="#{bean.cuenta.scuenta}" maxlength="15">
												<p:ajax event="change" listener="#{bean.leftPad}" update="form1:panel-filtros"/>
											</p:inputText>
										</p:column>
										
										<p:column>
											<p:inputText id="SsctaInput" style="width: 14em;" value="#{bean.cuenta.sscuenta}" maxlength="20">
												<p:ajax event="change" listener="#{bean.leftPad}" update="form1:panel-filtros"/>
											</p:inputText>
										</p:column>
										
										<p:column>
											<p:inputText id="SssctaInput" style="width: 5em;" value="#{bean.cuenta.ssscuenta}" maxlength="4">
												<p:ajax event="change" listener="#{bean.leftPad}" update="form1:panel-filtros"/>
											</p:inputText>
										</p:column>
										
										<p:column>
											<p:inputText id="SsssctaInput" style="width: 5em;" value="#{bean.cuenta.sssscuenta}" maxlength="3">
												<p:ajax event="change" listener="#{bean.leftPad}" update="form1:panel-filtros"/>
											</p:inputText>
										</p:column>
										
										<p:column>
											<p:selectOneMenu id="mesInputOri" editable="false" value="#{bean.mes}" style="">
												<f:selectItem itemValue="1" itemLabel="01" />
												<f:selectItem itemValue="2" itemLabel="02" />
												<f:selectItem itemValue="3" itemLabel="03" />
												<f:selectItem itemValue="4" itemLabel="04" />
												<f:selectItem itemValue="5" itemLabel="05" />
												<f:selectItem itemValue="6" itemLabel="06" />
												<f:selectItem itemValue="7" itemLabel="07" />
												<f:selectItem itemValue="8" itemLabel="08" />
												<f:selectItem itemValue="9" itemLabel="09" />
												<f:selectItem itemValue="10" itemLabel="10" />
												<f:selectItem itemValue="11" itemLabel="11" />
												<f:selectItem itemValue="12" itemLabel="12" />
											</p:selectOneMenu>
										</p:column>
										
									</p:row>
									
									
									<p:row>
										<p:column colspan="7">
											<h:panelGroup styleClass="pull-right" style="margin-right: 1.5em;">
												<p:commandButton icon="pi pi-play" id="generateportepdf"
												    onstart="PF('blockUIWidget').block()"
													action="#{bean.createFilePdfInlineValidate}"
													value="Generar" update="form1:visor, :form1:growlReportador">
												</p:commandButton>
												<h:commandLink style="display:none;" id="donwloadTxt"
													onclick="PrimeFaces.monitorDownload(start, stop);">
													<p:fileDownload value="#{bean.fileTxt}"/>
												</h:commandLink>	
												<p:commandLink actionListener="#{bean.createFileTxtInlineValidate}" title="TXT" styleClass="sg-btn-sm">
													<i class="pi pi-file" /> TXT
												</p:commandLink>
											</h:panelGroup>
										</p:column>
									</p:row>
									
								</p:panelGrid>
							</h:panelGrid>
						</div>
					</div>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (bean.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"	visible="#{bean.uuid ne null}">
	
								<object type="application/pdf" style="margin-top: 1em;"
									data="#{request.contextPath}/GetFileInline?uuid=#{bean.uuid}&amp;filename=#{bean.endFilename}" height="640px" width="100%">
									Tu browser no puede	desplegar el PDF.
									</object>
	
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
				
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
