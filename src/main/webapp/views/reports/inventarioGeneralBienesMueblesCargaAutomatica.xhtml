<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>

	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:param name="bean"
			value="#{inventarioGeneralBienesMueblesCargaAutomaticaMB}" />
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Carga Autimatica de Bienes Muebles</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">

						<p:fileUpload listener="#{bean.handleFileUpload}"
							id="file" mode="advanced" dragDrop="false"
							update="growlReportador, form1:file" accept=".csv"
							onstart="PF('blockUIWidget').block()"
							oncomplete="PF('blockUIWidget').unblock()" label="Seleccionar"
							cancelLabel="Cancelar" uploadLabel="Cargar"><p:validateFile sizeLimit="4000000" allowTypes="/(bienesm.)(csv)$/" fileLimit="1"/></p:fileUpload>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>

</h:body>
</html>
