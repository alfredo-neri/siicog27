<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Edo. Análitico del Ejer. del Pres. de Egr. Det. Clasificación por Obj. del Gasto</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:focus context="ctrlPanel" />
					<p:panelGrid columns="2" styleClass="col-centered ui-noborder" layout="tabular">
						<p:selectBooleanCheckbox
							value="#{clasificacionObjGastoMB.acumulado}"
							style="	display: flex;	align-items: center;	justify-items: center;"
							itemLabel="Acumulado" />
						<p:selectOneButton value="#{clasificacionObjGastoMB.tipoPeriodo}">
							<f:selectItems value="#{clasificacionObjGastoMB.tiposPeridos}"
								var="p" itemValue="#{p}" itemLabel="#{p}" />
							<p:ajax event="change"
								listener="#{clasificacionObjGastoMB.changePeriodo}"
								update="panelReporte" />
						</p:selectOneButton>
					</p:panelGrid>
					<p:panelGrid columns="7" styleClass="col-centered ui-noborder"
						id="ctrlPanel" layout="tabular">
						<h:outputText value="Periodo: " for="trim"
							rendered="#{not empty clasificacionObjGastoMB.periodos}" />
						<p:selectOneMenu id="trim" editable="false"
							converter="genericConverter"
							rendered="#{!clasificacionObjGastoMB.periodos.isEmpty()}"
							value="#{clasificacionObjGastoMB.periodo}">
							<f:selectItems value="#{clasificacionObjGastoMB.periodos}"
								var="p" itemValue="#{p}" itemLabel="#{p.descripcion}" />
						</p:selectOneMenu>
						<h:outputText value="No. Decimales:" for="noDecimales" />
						<p:selectOneMenu id="noDecimales" size="18" editable="false"
							value="#{clasificacionObjGastoMB.noDecimales}">
							<f:selectItem itemValue="1" itemLabel="1" />
							<f:selectItem itemValue="2" itemLabel="2" />
							<f:selectItem itemValue="3" itemLabel="3" />
							<f:selectItem itemValue="4" itemLabel="4" />
							<f:selectItem itemValue="5" itemLabel="5" />
						</p:selectOneMenu>

						<p:selectOneMenu id="miles" size="18" editable="false"
							value="#{clasificacionObjGastoMB.pesos}">
							<f:selectItem itemValue="1" itemLabel="Pesos" />
							<f:selectItem itemValue="2" itemLabel="Miles de Pesos" />
						</p:selectOneMenu>
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
							<p:commandButton icon="pi pi-play" id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{clasificacionObjGastoMB.createFilePdfInline}"
								value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
								<p:fileDownload value="#{clasificacionObjGastoMB.fileXls}" />
							</h:commandLink>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL" styleClass="sg-btn-sm">
								<i class="pi pi-file" /> TXT
								<p:fileDownload value="#{clasificacionObjGastoMB.fileTxt}" />
							</h:commandLink>
						</p:panelGrid>
					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (clasificacionObjGastoMB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{clasificacionObjGastoMB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{clasificacionObjGastoMB.uuid}&amp;filename=#{clasificacionObjGastoMB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
