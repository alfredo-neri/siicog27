<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Programa Anual de Obra (Reparación y Mantenimiento)</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">

						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
							<p:commandButton icon="pi pi-play" id="txt" value="Generar"
								actionListener="#{paormMB.downloadTxt}"
								update=":form1:growlReportador, :form1:downTxt">
							</p:commandButton>
							<p:commandButton style="display: none" id="downTxt" ajax="false">
								<p:fileDownload value="#{paormMB.file}" />
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
