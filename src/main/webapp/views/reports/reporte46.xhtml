<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Indicadores Mensual de Impacto de la Deuda a Corto Plazo Sobre los Ingresos</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">
						<p:panelGrid columns="2" styleClass="ui-noborder" layout="tabular">
							<h:outputText value="Mes: " for="idMes" />
							<p:selectOneMenu id="idMes" value="#{reporte46MB.mes}">
								<f:selectItems value="#{reporte46MB.listMes}" var="meses"
									itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
								<p:ajax event="change" listener="#{reporte46MB.changeMes()}"
									update=":form1:cap100, :form1:cap200, :form1:cap300" />
							</p:selectOneMenu>
						</p:panelGrid>
						<p:panelGrid columns="2" styleClass="ui-noborder" layout="tabular">
							<h:outputText value="" />
							<h:outputText value="" />
							<h:outputText value="OBSERVACIONES" />
							<h:outputText value="" />
							<h:outputText value="Total de Pasivo a Corto Plazo: "
								for="TotPasCortoPlz" />
							<p:inputText id="cap100" value="#{reporte46MB.pm5311.obs1}"
								maxlength="340" />
							<h:outputText value="Ingresos Totales: " for="IngresoTot" />
							<p:inputText id="cap200" value="#{reporte46MB.pm5311.obs2}"
								maxlength="340" />
							<h:outputText value="Ingreso Por Financiamiento: "
								for="IngrePoFin" />
							<p:inputText id="cap300" value="#{reporte46MB.pm5311.obs3}"
								maxlength="340" />
							<p:commandButton icon="pi pi-play" id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{reporte46MB.viewPdf()}" value="Generar"
								update="form1:visor, :form1:growlReportador">
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
						</div>
						<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
						<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
							<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (reporte46MB.uuid ne null)}">
								<i class="pi pi-file-pdf" />
								<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
							</h:panelGroup>
							<p:panel id="inlinePdf" style="border:0px"
								visible="#{reporte46MB.uuid ne null}">
								<object type="application/pdf"
									data="#{request.contextPath}/GetFileInline?uuid=#{reporte46MB.uuid}&amp;filename=#{reporte46MB.endFilename}"
									height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
							</p:panel>
						</h:panelGroup>
					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
