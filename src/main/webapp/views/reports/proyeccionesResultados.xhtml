<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="msgs" showDetail="true" />
				<p:commandButton style="display: none;" id="hiddenUpdate"
					name="hiddenUpdate"
					actionListener="#{proyeccionResultadosMB.refreshData}"
					update=":form1:msgs, :form1:object, :form1:banderaEdit, form1:add, form1:buscar, form1:trimestre" />
				<p:inputText id="banderaEdit" type="hidden"
					value="#{proyeccionResultadosMB.bEdition}" />
				<p:remoteCommand id="lasPage" name="lastPage"
					oncomplete="activeRow(#{proyeccionResultadosMB.listProyRes.size()})"
					update=":form1:object" />


				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panel" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Proyecciones y Resultados</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">
					<p:fieldset style="margin-bottom:20px">
						<p:panelGrid id="idForm"
							styleClass="col-centered row-centered ui-noborder" layout="tabular" columns="0">
							<p:row>
								<p:column style="text-align: right;">
									<p:outputLabel value="Tipo: " />
								</p:column>
								<p:column style="text-align: left;">
									<p:selectOneMenu id="trimestre"
										disabled="#{proyeccionResultadosMB.bAdicionar}"
										value="#{proyeccionResultadosMB.tipo}">
										<f:selectItem itemValue="P" itemLabel="Proyecciones" />
										<f:selectItem itemValue="R" itemLabel="Resultados" />
									</p:selectOneMenu>
								</p:column>
								<p:column>
									<p:commandButton value="Buscar" id="buscar"
										disabled="#{proyeccionResultadosMB.bAdicionar}"
										update=":form1:object, :form1:msgs"
										actionListener="#{proyeccionResultadosMB.refreshData}"
										icon="ui-icon-search" />
								</p:column>
							</p:row>
							<p:row>
								<p:column colspan="3">

									<p:commandButton value="Adicionar" id="add" icon="ui-icon-tag"
										disabled="#{proyeccionResultadosMB.bAdicionar}"
										onclick="$('.ui-row-editor span.ui-icon-pencil').each(function(){$(this).css('visibility','hidden')});"
										update=":form1:object, :form1:banderaEdit, form1:add, form1:buscar, form1:trimestre, form1:object:deleteRow" />
									<!-- actionListener="#{proyeccionResultadosMB.addElement}" -->
								</p:column>
							</p:row>
						</p:panelGrid>

						<p:dataTable id="object" var="objects"
							value="#{proyeccionResultadosMB.dataProyRes.listT}"
							binding="#{table}" emptyMessage="No hay registros"
							paginator="true" rows="20"
							selection="#{proyeccionResultadosMB.dataProyRes.selected}"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink}"
							widgetVar="balanceWdg" rowKey="#{objects.id}" editable="true"
							rowIndexVar="rowIndex">

							<p:ajax event="rowEdit"
								listener="#{proyeccionResultadosMB.onRowEdit}"
								update=":form1:msgs, :form1:object, :form1:banderaEdit, form1:add, form1:buscar, form1:trimestre, form1:object:deleteRow"
								oncomplete="jQuery('#form1\\\\:hiddenUpdate').click();" />

							<p:ajax event="rowEditInit"
								disabled="#{proyeccionResultadosMB.bAdicionar}"
								listener="#{proyeccionResultadosMB.onInitRowEdit}"
								oncomplete="$('.ui-row-editor span.ui-icon-pencil').each(function(){$(this).css('visibility','visible')}); jQuery('#form1\\\\:add').click();"
								update=" form1:add, form1:buscar, form1:trimestre, form1:object:deleteRow" />
							<p:ajax event="rowEditCancel"
								listener="#{proyeccionResultadosMB.refreshData}"
								update=":form1:msgs, form1:add, form1:buscar, form1:trimestre" />
							<p:ajax event="page" onstart="PF('blockUIWidget').block();"
								update=":form1:object"
								oncomplete="PF('blockUIWidget').unblock();lastPage();" />
							<p:column headerText="Etiquetado" style="width:7%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.etiquetado}" />
									</f:facet>
									<f:facet name="input">
										<p:inputText id="trim" value="#{objects.etiquetado}" />
									</f:facet>
								</p:cellEditor>
							</p:column>

							<p:column headerText="Cuenta" style="width:10%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.cuenta}" />
									</f:facet>
									<f:facet name="input">
										<p:inputText maxlength="6" size="6" id="consecutivo"
											value="#{objects.cuenta}" style="width:100%">
											<p:keyFilter mask="pint" for="consecutivo" />
											<p:ajax event="blur" update="consecutivo" />
										</p:inputText>
									</f:facet>
								</p:cellEditor>
							</p:column>

							<p:column headerText="Concepto" style="width:30%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.concepto}" />
									</f:facet>
									<f:facet name="input">
										<p:inputText id="concepto" value="#{objects.concepto}"
											onkeyup="this.value=this.value.toUpperCase();"
											style="width:100%">
											<p:ajax event="blur" update="concepto" />
										</p:inputText>
									</f:facet>
								</p:cellEditor>
							</p:column>

							<p:column headerText="Año en Cuestión #{proyeccionResultadosMB.currentYear}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.currentYear}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											decimalSeparator="." id="current"
											value="#{objects.currentYear}" style="width:100%">
											<p:ajax event="blur" update="current" />
										</p:inputNumber>

									</f:facet>
								</p:cellEditor>
							</p:column>
							<p:column headerText="Año 1 / #{proyeccionResultadosMB.year1}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.year1}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											decimalSeparator="." id="year1"
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											value="#{objects.year1}" style="width:100%">
											<p:ajax event="blur" update="year1" />
										</p:inputNumber>

									</f:facet>
								</p:cellEditor>
							</p:column>

							<p:column headerText="Año 2 / #{proyeccionResultadosMB.year2}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.year2}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											decimalSeparator="." id="year2"
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											onkeypress="if(event.keyCode == 27) {jQuery('span.ui-icon-close').last().click(); return false;} if (event.keyCode == 13 || event.keyCode == 9) {jQuery('#form1\\:object span.ui-icon-check').last().click(); return false; } "
											value="#{objects.year2}" style="width:100%">
											<p:ajax event="blur" update="year2" />
										</p:inputNumber>
									</f:facet>
								</p:cellEditor>
							</p:column>
							<p:column headerText="Año 3 / #{proyeccionResultadosMB.year3}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.year3}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											decimalSeparator="." id="year3"
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											onkeypress="if(event.keyCode == 27) {jQuery('span.ui-icon-close').last().click(); return false;} if (event.keyCode == 13 || event.keyCode == 9) {jQuery('#form1\\:object span.ui-icon-check').last().click(); return false; } "
											value="#{objects.year3}" style="width:100%">
											<p:ajax event="blur" update="year3" />
										</p:inputNumber>
									</f:facet>
								</p:cellEditor>
							</p:column>
							<p:column headerText="Año 4 / #{proyeccionResultadosMB.year4}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.year4}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											decimalSeparator="." id="year4"
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											onkeypress="if(event.keyCode == 27) {jQuery('span.ui-icon-close').last().click(); return false;} if (event.keyCode == 13 || event.keyCode == 9) {jQuery('#form1\\:object span.ui-icon-check').last().click(); return false; } "
											value="#{objects.year4}" style="width:100%">
											<p:ajax event="blur" update="year4" />
										</p:inputNumber>
									</f:facet>
								</p:cellEditor>
							</p:column>
							<p:column headerText="Año 5 / #{proyeccionResultadosMB.year5}" style="width:17%">
								<p:cellEditor>
									<f:facet name="output">
										<h:outputText value="#{objects.year5}">
											<f:convertNumber pattern="¤#,##0.00" />
										</h:outputText>
									</f:facet>
									<f:facet name="input">
										<p:inputNumber decimalPlaces="2" thousandSeparator=","
											decimalSeparator="." id="year5"
											minValue="-999999999999999.99" maxValue="999999999999999.99"
											onkeypress="if(event.keyCode == 27) {jQuery('span.ui-icon-close').last().click(); return false;} if (event.keyCode == 13 || event.keyCode == 9) {jQuery('#form1\\:object span.ui-icon-check').last().click(); return false; } "
											value="#{objects.year5}" style="width:100%">
											<p:ajax event="blur" update="year5" />
										</p:inputNumber>
									</f:facet>
								</p:cellEditor>
							</p:column>
							<p:column style="width:5%">
								<p:rowEditor />
							</p:column>
							<p:column headerText="Borrar" exportable="false" width="6%">
								<p:commandLink id="deleteRow"
									actionListener="#{proyeccionResultadosMB.delete(rowIndex)}"
									oncomplete="jQuery('#form1\\\\:hiddenUpdate').click();"
									update=":form1:msgs, :form1:object, form1:add, form1:buscar, form1:trimestre"
									image="ui-icon ui-icon-close" title="Delete">
									<p:confirm header="Confirmación"
										message="¿Desea eliminar éste registro?" icon="ui-icon-alert" />
									<f:setPropertyActionListener value="#{object}"
										target="#{proyeccionResultadosMB.dataProyRes.selected}" />
									<h:outputText styleClass="ui-icon ui-icon-close" />

								</p:commandLink>
							</p:column>
						</p:dataTable>

					</p:fieldset>

					<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
						<p:commandButton value="Si" type="button"
							styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
						<p:commandButton value="No" type="button"
							styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
					</p:confirmDialog>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
			<script type="text/javascript">
			     
					 function activeRow(index) {
						 var bEdition =  $('#form1\\:banderaEdit').val();
						 
						 if(bEdition == "true") {
							 var rows = 20;
							 var size = index;
							 var indexOf = (size % rows);
							
						      jQuery('#form1\\:object span.ui-icon-pencil').eq(indexOf).each(function(){jQuery(this).click()});
						 }
					 }
			    
			</script>
		</ui:define>
	</ui:composition>
</h:body>
</html>
