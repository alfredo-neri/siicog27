<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
				<h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Reportes</div>
							<h1>Archivo txt de Cuenta P&uacute;blica Estado Anal&iacute;tico de Ingresos</h1>
						</div>
					</div>
					<div class="sg-card">
						<div class="sg-card-b sg-rep">

					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">
						<p:panelGrid columns="6" styleClass="ui-noborder" layout="tabular">

							<h:outputText value="No. Decimales:" for="noDecimales" />
							<p:selectOneMenu id="noDecimales" size="18" editable="false"
								value="#{eAIngresos219MB.noDecimales}">
								<f:selectItem itemValue="2" itemLabel="2" />
								<f:selectItem itemValue="3" itemLabel="3" />
								<f:selectItem itemValue="4" itemLabel="4" />
								<f:selectItem itemValue="5" itemLabel="5" />
							</p:selectOneMenu>
							
							<h:outputText value="Ctas. Saldo 0:" for="ctaCero" />
							<p:selectOneMenu id="ctaCero" size="18" editable="false"
								value="#{eAIngresos219MB.ctaCero}">
								<f:selectItem itemValue="S" itemLabel="Si" />
								<f:selectItem itemValue="N" itemLabel="No" />
							</p:selectOneMenu>

							<p:selectOneMenu id="miles" size="18" editable="false"
								value="#{eAIngresos219MB.pesos}">
								<f:selectItem itemValue="0" itemLabel="Pesos" />
								<f:selectItem itemValue="1" itemLabel="Miles de Pesos" />
							</p:selectOneMenu>
							<p:commandButton value="Generar" ajax="false" id="correcto"
								onclick="PrimeFaces.monitorDownload(start, stop);"
								actionListener="#{eAIngresos219MB.downLoadFile}"
								update=":form1:growlReportador" icon="ui-icon-arrowthick-1-s">
								<p:fileDownload value="#{eAIngresos219MB.fileTxt}" />
							</p:commandButton>

						</p:panelGrid>
					</p:panelGrid>
						</div>
					</div>
				</h:panelGroup>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
