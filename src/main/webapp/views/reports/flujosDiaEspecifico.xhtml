<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" xmlns:pe="http://primefaces.org/ui/extensions">

	<h:body>
	    <ui:composition template="/WEB-INF/layout/layout.xhtml">
	        <ui:param name="bean" value="#{flujosDiaEspecificoMB}"></ui:param>
	        <ui:define name="content">
	            <script>
	                $(document).ready(() => {
	                    $(PrimeFaces.escapeClientId('form1:panelReporte')).parents('.container-fluid:first').css('text-align', 'center');
	                })
	            </script>
	            <style>
	                span.calendar-small input {
	                    width: 6em;
	                }
	                
	                .calendar-small {
	                    padding-right: 1em;
	                }
	            </style>
	            <h:form id="form1" style="display: inline-block; margin-left: auto; margin-right: auto; ">
	                <p:growl id="growlReportador" showDetail="true" sticky="true"><p:autoUpdate/></p:growl>
	                <!-- SIICOG fase 3: marco de la Balanza de Comprobacion (encabezado + tarjeta); antes p:panel con header -->
	                <h:panelGroup id="panelReporte" layout="block" styleClass="sg-page sg-reporte">
	                	<div class="sg-page-h">
	                		<div>
	                			<div class="sg-crumbs">Reportes</div>
	                			<h1>Flujos por dia específico</h1>
	                		</div>
	                	</div>
	                	<div class="sg-card">
	                		<div class="sg-card-b sg-rep">
	                    <div class="col-centered row-centered">
	                        <p:outputLabel for="event" value="Fecha:" />
	                        <p:calendar id="event" value="#{bean.fecha}" pattern="dd/MM/yyyy" mask="true" styleClass="calendar-small" locale="es">
	                        </p:calendar>
	                        <p:commandButton icon="pi pi-play" id="generateportepdf" onstart="PF('blockUIWidget').block()" action="#{bean.createFilePdfInlineValidate}" value="Generar" update="form1:visor, :form1:growlReportador">
	                        </p:commandButton>
							<h:commandLink style="display:none;" id="donwloadTxt"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{bean.fileTxt}"/>
							</h:commandLink>
							<p:commandLink actionListener="#{bean.createFileXlsInlineValidate}" title="Excel" styleClass="sg-btn-sm">
								<i class="pi pi-file-excel" /> Excel
							</p:commandLink>
							<h:commandLink style="display:none;" id="donwloadXls"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{bean.fileXls}"/>
							</h:commandLink>
	                        <p:commandLink actionListener="#{bean.createFileTxtInlineValidate}" title="TXT" styleClass="sg-btn-sm">
								<i class="pi pi-file" /> TXT
							</p:commandLink>
	                    </div>
	                		</div>
	                		<!-- SIICOG fase 3: visor oscuro de la Balanza: siempre visible, con aviso mientras no hay reporte -->
	                		<h:panelGroup id="visor" layout="block" styleClass="sg-visor">
	                			<h:panelGroup layout="block" styleClass="sg-visor-vacio" rendered="#{not (bean.uuid ne null)}">
	                				<i class="pi pi-file-pdf" />
	                				<span>Elige los filtros y pulsa <b>Generar</b> para ver el reporte.</span>
	                			</h:panelGroup>
	                			<p:panel id="inlinePdf" style="border:0px" visible="#{bean.uuid ne null}">
	
	                			    <object type="application/pdf" style="margin-top: 1em;" data="#{request.contextPath}/GetFileInline?uuid=#{bean.uuid}&amp;filename=#{bean.endFilename}" height="640px" width="100%"> Tu browser no puede
									desplegar el PDF. </object>
	
	                			</p:panel>
	                		</h:panelGroup>
	                	</div>
	                </h:panelGroup>
	
	            </h:form>
	        </ui:define>
	    </ui:composition>
	</h:body>

</html>
