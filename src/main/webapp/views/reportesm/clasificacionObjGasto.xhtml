<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"> <h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte"
					header="Edo. Análitico del Ejer. del Pres. de Egr. Det. Clasificación por Obj. del Gasto"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="5" styleClass="col-centered ui-noborder" layout="tabular">

						<h:outputText value="Reporte:" for="tipoRepore" />
						<p:selectOneMenu id="tipoRepore" size="18" editable="false"
							value="#{clasificacionObjGastoMB2.reporte}">
							<f:selectItem itemValue="T" itemLabel="Trimestral" />
							<f:selectItem itemValue="A" itemLabel="Acumulado" />
						</p:selectOneMenu>
						
						<h:outputText value="Trimestre: " for="mesInputOri" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{clasificacionObjGastoMB2.trimestre}">
							<f:selectItems value="#{clasificacionObjGastoMB2.listTrimestres}"
								var="trim" itemLabel="#{trim.periodo}"
								itemValue="#{trim.periodo}"></f:selectItems>
						</p:selectOneMenu>
						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">
							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{clasificacionObjGastoMB2.createFilePdfInline}"
								value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL">
								<p:graphicImage value="../reports/excel.png" width="24" />
								<p:fileDownload value="#{clasificacionObjGastoMB2.fileXls}" />
							</h:commandLink>
							<p:commandButton id="generareportetxt"
								value="Generar Archivo TXT" ajax="false"
								styleClass="btn btn-default" update=":form1:growlReportador"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{clasificacionObjGastoMB2.file}" />
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
					<p:panel id="inlinePdf" style="border:0px"
						visible="#{clasificacionObjGastoMB2.uuid ne null}">
						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{clasificacionObjGastoMB2.uuid}&amp;filename=#{clasificacionObjGastoMB2.endFilename}"
							height="380px" width="100%"> Tu browser no puede
						desplegar el PDF. </object>
					</p:panel>
				</p:panel>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body> </html>
