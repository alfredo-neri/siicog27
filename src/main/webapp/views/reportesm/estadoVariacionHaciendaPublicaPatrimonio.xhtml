<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte"
					header="Estado de Variacion en la Hacienda Publica Patrimonio"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">
						<h:outputText value="Mes del Reporte: " for="mesInputOri" />
						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							value="#{estadoVariacionHaciendaPublicaPatrimonioMB2.mes}">
							<f:selectItem itemValue="1" itemLabel="01" />
							<f:selectItem itemValue="2" itemLabel="02" />
							<f:selectItem itemValue="3" itemLabel="03" />
							<f:selectItem itemValue="4" itemLabel="04" />
							<f:selectItem itemValue="5" itemLabel="05" />
							<f:selectItem itemValue="6" itemLabel="06" />
							<f:selectItem itemValue="7" itemLabel="07" />
							<f:selectItem itemValue="8" itemLabel="08" />
							<f:selectItem itemValue="9" itemLabel="09" />
							<f:selectItem itemValue="10" itemLabel="10" />
							<f:selectItem itemValue="11" itemLabel="11" />
							<f:selectItem itemValue="12" itemLabel="12" />
						</p:selectOneMenu>

						<p:panelGrid columns="4" styleClass="ui-noborder" layout="tabular">

							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{estadoVariacionHaciendaPublicaPatrimonioMB2.viewPdf}"
								value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>

							<!-- 
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{estadoVariacionHaciendaPublicaPatrimonioMB2.fileCsv}" />
									</h:commandLink>
									 -->

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL">
								<p:graphicImage value="../reports/excel.png" width="24" />
								<p:fileDownload
									value="#{estadoVariacionHaciendaPublicaPatrimonioMB2.fileXls}" />
							</h:commandLink>


							<!-- 
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" >
										<p:graphicImage value="txt.png" width="24" />
										<p:fileDownload value="#{estadoVariacionHaciendaPublicaPatrimonioMB2.fileTxt}"/>
									</h:commandLink>
									 -->

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT">
								<p:graphicImage value="../reports/txt.png" width="24" />
								<p:fileDownload
									value="#{estadoVariacionHaciendaPublicaPatrimonioMB2.psFileTxt}" />
							</h:commandLink>

						</p:panelGrid>
					</p:panelGrid>




					<p:panel id="inlinePdf" style="border:0px"
						visible="#{estadoVariacionHaciendaPublicaPatrimonioMB2.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{estadoVariacionHaciendaPublicaPatrimonioMB2.uuid}&amp;filename=#{estadoVariacionHaciendaPublicaPatrimonioMB2.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>
					</p:panel>
				</p:panel>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
