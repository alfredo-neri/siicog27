<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte" header="Estado Analítico del Activo"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="6" styleClass="col-centered ui-noborder" layout="tabular">

						<p:panelGrid columns="7" styleClass="ui-noborder" layout="tabular">

							<h:outputText value="Mes: " for="mesInputOri" />
							<p:selectOneMenu id="idDependencia" value="#{rF0010113MB2.mes}">
								<f:selectItems value="#{rF0010113MB2.listMes}" var="meses"
									itemValue="#{meses.mes}" itemLabel="#{meses.mes}" />
							</p:selectOneMenu>

							<h:outputText value="Con saldo cero: " for="idSaldo" />
							<p:selectOneMenu id="idSaldo" value="#{rF0010113MB2.saldo}">
								<f:selectItem itemValue="S" itemLabel="S" />
								<f:selectItem itemValue="N" itemLabel="N" />
							</p:selectOneMenu>
							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{rF0010113MB2.viewPdf}" value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>

							<!-- 									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="CSV">
										<p:graphicImage value="csv.png" width="24" />
										<p:fileDownload value="#{rF0010113MB2.fileCsv}" />
									</h:commandLink>
									
									<h:commandLink
										onclick="PrimeFaces.monitorDownload(start, stop);" title="TXT" >
										<p:graphicImage value="txt.png" width="24" />
										<p:fileDownload value="#{rF0010113MB2.fileTxt}"/>
									</h:commandLink>
									
									 -->

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL">
								<p:graphicImage value="../reports/excel.png" width="24" />
								<p:fileDownload value="#{rF0010113MB2.fileXls}" />
							</h:commandLink>
							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="TXT">
								<p:graphicImage value="../reports/txt.png" width="24" />
								<p:fileDownload value="#{rF0010113MB2.psFileTxt}" />
							</h:commandLink>

						</p:panelGrid>
					</p:panelGrid>




					<p:panel id="inlinePdf" style="border:0px"
						visible="#{rF0010113MB2.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{rF0010113MB2.uuid}&amp;filename=#{rF0010113MB2.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>


				</p:panel>

			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
