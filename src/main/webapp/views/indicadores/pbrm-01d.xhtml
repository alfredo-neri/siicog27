<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte"
					header="PbRM-01d Ficha T&eacute;cnica de Diseño de Indicadores"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="3" styleClass="col-centered ui-noborder" layout="tabular">
						<p:panelGrid columns="5" styleClass="ui-noborder" layout="tabular">
							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{pbrm01dMB.createFilePdfInline}" value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>
							
							<h:outputText value="Trimestre: " for="mesInputOri" />
							
							<p:selectOneMenu id="mesInputOri" size="18" editable="false"
								value="#{pbrm01dMB.trimestre}">
								<f:selectItems value="#{pbrm01dMB.listTrimestres}"
									var="trim" itemLabel="#{trim.periodo}"
									itemValue="#{trim.periodo}"></f:selectItems>
							</p:selectOneMenu>
							
							 <h:commandLink
								onclick="PrimeFaces.monitorDownload(start, stop);" title="EXCEL" >
								<p:graphicImage value="excel.png" width="24" />
								<p:fileDownload value="#{pbrm01dMB.fileXls}" />
							</h:commandLink>
							
							<p:commandButton id="generareportetxt"
								value="Generar Archivo TXT" ajax="false"
								styleClass="btn btn-default" update=":form1:growlReportador"
								onclick="PrimeFaces.monitorDownload(start, stop);">
								<p:fileDownload value="#{pbrm01dMB.file}" />
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>
					<p:panel id="inlinePdf" style="border:0px"
						visible="#{pbrm01dMB.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{pbrm01dMB.uuid}&amp;filename=#{pbrm01dMB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>
				</p:panel>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
