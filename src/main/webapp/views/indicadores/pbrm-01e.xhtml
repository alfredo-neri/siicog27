<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte" header="PbRM-01e Matriz de Indicadores"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">

					<p:accordionPanel id="tabs">
						<p:ajax event="tabChange" listener="#{pbrm01eMB.onTabChange}"
							update=":form1:growlReportador, :form1:tabs, :form1:inlinePdf" />

						<p:tab id="normal" title="Normal">

							<p:panelGrid columns="4"
								styleClass="col-centered row-centered ui-noborder" layout="tabular">
								<p:commandButton id="generateportepdf"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()"
									action="#{pbrm01eMB.createFilePdfInline}" value="Correcto"
									update="form1:inlinePdf, :form1:growlReportador"
									styleClass="btn btn-default">
								</p:commandButton>
								<h:commandLink
									onclick="PrimeFaces.monitorDownload(start, stop);"
									title="EXCEL">
									<p:graphicImage value="../reports/excel.png" width="24" />
									<p:fileDownload value="#{pbrm01eMB.fileXls}" />
								</h:commandLink>
								<p:commandButton id="generareportetxt"
									value="Generar Archivo TXT" ajax="false"
									styleClass="btn btn-default" update=":form1:growlReportador"
									onclick="PrimeFaces.monitorDownload(start, stop);">
									<p:fileDownload value="#{pbrm01eMB.file}" />
								</p:commandButton>
							</p:panelGrid>

						</p:tab>

						<p:tab id="anual" title="Anual">

							<p:commandButton id="generateportepdf2"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{pbrm01eMB.createFilePdfInline}" value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>&nbsp;&nbsp;&nbsp;

							<h:commandLink onclick="PrimeFaces.monitorDownload(start, stop);"
								title="EXCEL">
								<p:graphicImage value="../reports/excel.png" width="24" />
								<p:fileDownload value="#{pbrm01eMB.fileXls}" />
							</h:commandLink>
						</p:tab>

					</p:accordionPanel>

					<p:panel id="inlinePdf" style="border:0px"
						visible="#{pbrm01eMB.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{pbrm01eMB.uuid}&amp;filename=#{pbrm01eMB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>
				</p:panel>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
