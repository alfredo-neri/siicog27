<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:panel id="panel" header="Carga de matrices"
					styleClass="green col-md-6 col-centered row-centered shadow-panel">
					<p:messages id="messages" showDetail="true" closable="true" />
					<p:focus context="panelCarga" />
					<p:outputLabel value="Seleccione archivo" />
					<p:panelGrid columns="2" id="panelCarga"
						styleClass="col-centered row-centered ui-noborder">
						<p:fileUpload
							fileUploadListener="#{matrizCargaMB.handleFileUpload}"
							mode="advanced" dragDropSupport="false" multiple="false"
							update=":form1:messages, errorsFile" sizeLimit="1000000000000"
							accept=".csv" allowTypes="/(\.|\/)(csv)$/"
							invalidSizeMessage="Tamaño invalido de archivo."
							invalidFileMessage="Tipo invalido de archivo."
							cancelLabel="Cancelar" label="Elegir" uploadLabel="Cargar">
						</p:fileUpload>
					</p:panelGrid>
					<p:panelGrid columns="4" id="errorsFile"
						styleClass="col-centered row-centered ui-noborder">
						<p:commandButton value="Descargar archivo de Errores" ajax="false"
							rendered="#{not empty matrizCargaMB.fileError}">
							<p:fileDownload value="#{matrizCargaMB.file}"></p:fileDownload>
						</p:commandButton>
					</p:panelGrid>
				</p:panel>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
