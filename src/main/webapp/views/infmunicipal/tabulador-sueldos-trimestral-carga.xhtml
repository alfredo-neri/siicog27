<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>


	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1" enctype="multipart/form-data">
				<p:growl id="growl" showDetail="true" sticky="true" />
				<p:panel id="pDigitaliza"
					header="Importar informaci&oacute;n de Tabulador de Sueldos"
					styleClass="green col-md-5 col-centered row-centered shadow-panel"
					widgetVar="pCargaAutomatica">

					<p:fileUpload
						listener="#{tabuladorSueldosTrimestralMB.handleFileUpload}"
						mode="advanced" dragDrop="false" update="growl" accept=".csv"
						
						label="Elegir" uploadLabel="Cargar" cancelLabel="Cancelar"><p:validateFile sizeLimit="100000" allowTypes="/(sueldos.)(csv)$/"/>
					</p:fileUpload>
				</p:panel>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
