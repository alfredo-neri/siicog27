<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:panel id="panelReporte" header="Empleados"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
				</p:panel>
				<p:panel id="panelEmpleadoBasico"
					header="Datos Personales Empleados"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="6" styleClass="col-centered ui-noborder">
						<h:outputText value="CURP" text-aling="left" />
						<p:inputText value="" id="curp" />
						<h:outputText value="Clave Empleado" />
						<p:inputText value="" id="clave" disabled="true" />
						<h:outputText value="Nombre" text-aling="left" />
						<p:inputText value="" id="nombre" />
						<h:outputText value="Primer Apellido" text-aling="left" />
						<p:inputText value="" id="ap" />
						<h:outputText value="Segundo Apellido" text-aling="left" />
						<p:inputText value="" id="am" />
						<h:outputText value="Fecha de Nacimiento" text-aling="left" />
						<p:inputText value="" id="fechanacimiento" />
						<h:outputText value="Genero" text-aling="left" />
						<p:selectOneMenu id="Genero">
							<f:selectItem itemLabel="Femenino" itemValue="fem" />
							<f:selectItem itemLabel="Masculino" itemValue="mas" />
							<f:selectItem itemLabel="Otro" itemValue="otro" />
						</p:selectOneMenu>

						<h:outputText value="Nacionalidad" text-aling="left" />
						<p:inputText value="" id="nacionalidad" />
						<h:outputText value="RFC" text-aling="left" />
						<p:inputText value="" id="rfc" />
						<h:outputText value="Homoclave" text-aling="left" />
						<p:inputText value="" id="homoclv" />

						
						

						<p:commandButton id="boton" value="Guardar" />
					</p:panelGrid>
				</p:panel>


			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
