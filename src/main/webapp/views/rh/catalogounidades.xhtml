<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:panel id="panelUnidadesAdministrativas"
					header="Catalogo Unidades Administrativas"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="6" styleClass="col-centered ui-noborder" layout="tabular">

						<h:outputText value="Clave " />
						<p:inputText value="" id="clave" disabled="true" />
						<h:outputText value="Unidad Administrativa" text-aling="left" />
						<p:inputText value="" id="unidadadmin" />

						<p:commandButton id="boton" value="Guardar" />
					</p:panelGrid>
					<p:dataTable var="unidades"
						value="#{catalogoUnidadesMB.listCatalog}" rows="10"
						paginator="true" paginatorPosition="both" id="objects"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
						currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records">
						<p:column headerText="Id">
							<h:outputText value="#{unidades.id}" />
						</p:column>
						<p:column headerText="Dependecia">
							<h:outputText value="#{unidades.dependencia}" />
						</p:column>
					</p:dataTable>
				</p:panel>


			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
