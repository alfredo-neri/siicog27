<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">

				<p:panel id="panelPrimaVacacional" header="Prima Vacacional"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:panelGrid columns="2" styleClass="col-centered ui-noborder">

						<h:outputText value="Fecha inicio" text-aling="left" />
						<p:calendar id="fechaiInput" showOn="button" locale="es" size="18"
							pattern="dd/MM/yyyy" mask="true" required="true"
							requiredMessage="Seleccione una fecha"
							converterMessage="La fecha debe ser en fomato de dd/MM/aaaa">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:calendar>
						<h:outputText value="Fecha Fin" text-aling="left" />
						<p:calendar id="fechafInput" showOn="button" locale="es" size="18"
							pattern="dd/MM/yyyy" mask="true" required="true"
							requiredMessage="Seleccione una fecha"
							converterMessage="La fecha debe ser en fomato de dd/MM/aaaa">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:calendar>
						<h:outputText value="Minimo dias pagados" text-aling="left" />
						<p:inputText value="" id="curp" />
						<h:outputText value="Porcentaje" text-aling="left" />
						<p:inputText value="" id="porcentaje" />
						<h:outputText value="Dias a Pagar" text-aling="left" />
						<p:inputText value="" id="diaspaga" />
						<h:outputText value="Umas" text-aling="left" />
						<p:inputText value="" id="umas" />
						<h:outputText value="Valor Uma" text-aling="left" />
						<p:inputText value="" id="valor" />


						<p:commandButton id="btnCancelar" value="Cancelar" />
						<p:commandButton id="btn1" value="Guardar" />
					</p:panelGrid>
				</p:panel>


			</h:form>
		</ui:define>
	</ui:composition>

</h:body>
</html>
