<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">
				<p:growl id="growlReportador" showDetail="true" sticky="true"></p:growl>
				<p:panel id="panelReporte"
					header="Reporte Estado de Situación Financiera Anual"
					styleClass="green col-md-9 col-centered row-centered shadow-panel">
					<p:commandButton style="display: none" id="downXls" ajax="false"
						onclick="PrimeFaces.monitorDownload(start, stop);">
						<p:fileDownload
							value="#{estadoSituacionFinancieraAnualMB.fileXls}" />
					</p:commandButton>

					<p:panelGrid columns="7" styleClass="col-centered ui-noborder">

						<p:selectOneMenu id="mesInputOri" size="18" editable="false"
							style="display: none;"
							value="#{estadoSituacionFinancieraAnualMB.mes}">

							<f:selectItem itemValue="12" itemLabel="12" />
						</p:selectOneMenu>
						<h:outputText value="No. Decimales:" for="noDecimales" />
						<p:selectOneMenu id="noDecimales" size="18" editable="false"
							value="#{estadoSituacionFinancieraAnualMB.noDecimales}">
							<f:selectItem itemValue="2" itemLabel="2" />
							<f:selectItem itemValue="3" itemLabel="3" />
							<f:selectItem itemValue="4" itemLabel="4" />
							<f:selectItem itemValue="5" itemLabel="5" />
						</p:selectOneMenu>

						<p:selectOneMenu id="miles" size="18" editable="false"
							value="#{estadoSituacionFinancieraAnualMB.pesos}">
							<f:selectItem itemValue="1" itemLabel="Pesos" />
							<f:selectItem itemValue="2" itemLabel="Miles de Pesos" />
						</p:selectOneMenu>

						<h:outputText value="Con Ctas de Orden (s/n): "
							for="ordenInputOri" />
						<p:selectOneMenu id="ordenInputOri" size="18" editable="false"
							value="#{estadoSituacionFinancieraAnualMB.orden}">
							<f:selectItem itemValue="S" itemLabel="S" />
							<f:selectItem itemValue="N" itemLabel="N" />
						</p:selectOneMenu>

						<p:panelGrid columns="3" styleClass="ui-noborder">

							<p:commandLink title="EXCEL"
								update=":form1:growlReportador, :form1:downXls"
								actionListener="#{estadoSituacionFinancieraAnualMB.downloadXls}">
								<p:graphicImage value="../reports/excel.png" width="24" />

							</p:commandLink>


							<p:commandButton id="generateportepdf"
								onstart="PF('blockUIWidget').block()"
								oncomplete="PF('blockUIWidget').unblock()"
								action="#{estadoSituacionFinancieraAnualMB.viewPdf}"
								value="Correcto"
								update="form1:inlinePdf, :form1:growlReportador"
								styleClass="btn btn-default">
							</p:commandButton>
						</p:panelGrid>
					</p:panelGrid>

					<p:panel id="inlinePdf" style="border:0px"
						visible="#{estadoSituacionFinancieraAnualMB.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{estadoSituacionFinancieraAnualMB.uuid}&amp;filename=#{estadoSituacionFinancieraAnualMB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>

				</p:panel>
				<pe:blockUI widgetVar="blockUIWidget">
					<h:panelGrid columns="2">
						<h:graphicImage value="../reports/indice.png"
							style="margin-right: 12px; vertical-align: middle;" />
						<h:outputText value="Please wait..." style="white-space: nowrap;" />
					</h:panelGrid>
				</pe:blockUI>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>
</html>
