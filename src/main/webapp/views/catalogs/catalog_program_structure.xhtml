<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"> <h:body>

	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">

				<p:remoteCommand name="onload"
					action="#{catalogProgramStructureMB.onPageLoad}"
					update=":form1:objects" />

				<p:growl id="messagesEdit" showDetail="true" sticky="true" />


				<div class="sg-page">
					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Contabilidad / Catálogos</div>
							<h1>Catálogo de Estructura Programática</h1>
						</div>
						<h:panelGroup id="panelButton" styleClass="sg-actions">
							<p:commandButton icon="pi pi-plus" value="Nuevo registro"
								onclick="PF('wingetPasswor').show(); resetPass();" />
						</h:panelGroup>
					</div>

					<!-- ===== Buscar en la estructura programática ===== -->
					<div class="sg-card">
						<div class="sg-card-h">
							<h2>Buscar en la estructura programática</h2>
						</div>
						<h:panelGroup id="panel" layout="block" styleClass="sg-card-b">
							<h:panelGroup id="display_1" layout="block" style="display: grid; gap: 16px;">
								<div class="sg-fields" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));">
									<div class="sg-field">
										<p:outputLabel for="fnSearchInput" value="Finalidad" />
										<p:inputText styleClass="mono" id="fnSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo0}"
											maxlength="2">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="fnSearchInput" /> -->
											<p:keyFilter for="fnSearchInput" mask="pint"></p:keyFilter>
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field">
										<p:outputLabel for="funSearchInput" value="Función" />
										<p:inputText styleClass="mono" id="funSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo1}"
											maxlength="2">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="funSearchInput" /> -->
											<p:keyFilter for="funSearchInput" mask="pint"></p:keyFilter>
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field">
										<p:outputLabel for="sfSearchInput" value="Subfunción" />
										<p:inputText styleClass="mono" id="sfSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo2}"
											maxlength="2">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="sfSearchInput" /> -->
											<p:keyFilter for="sfSearchInput" mask="pint"></p:keyFilter>
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field">
										<p:outputLabel for="progSearchInput" value="Programa" />
										<p:inputText styleClass="mono" id="progSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo3}"
											maxlength="2">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="progSearchInput" /> -->
											<p:keyFilter for="progSearchInput" mask="pint"></p:keyFilter>
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field">
										<p:outputLabel for="spSearchInput" value="Proyecto" />
										<p:inputText styleClass="mono" id="spSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo4}"
											maxlength="2">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="spSearchInput" /> -->
											<p:keyFilter for="spSearchInput" mask="pint"></p:keyFilter>
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field" style="grid-column: span 2;">
										<p:outputLabel for="nombreSearchInput" value="Nombre" />
										<p:inputText id="nombreSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo6}"
											maxlength="250">
											<!-- 							<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$" for="nombreSearchInput" /> -->
											<p:keyFilter regEx="/[a-zñA-ZÑ0-9 ,.áéíóúüÁÉÍÓÚÜÑ]/" />
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
									<div class="sg-field">
										<p:outputLabel for="estProgSearchInput" value="Estructura programática" />
										<p:inputText styleClass="mono" id="estProgSearchInput" name="estProgSearchInput"
											value="#{catalogProgramStructureMB.beanFind.campo7}"
											maxlength="12"
											validatorMessage="El campo EstProg solo permite valores alfanum&eacute;ricos">
											<f:validateRegex pattern="^\s*([0-9a-zA-Z]*)\s*$"
												for="estProgSearchInput" />
											<p:ajax event="keyup"
												update=":form1:messagesEdit, :form1:objects"
												listener="#{catalogProgramStructureMB.findValuesCatalog}" />
										</p:inputText>
									</div>
								</div>
								<div class="sg-actions">
									<p:commandButton icon="pi pi-search" value="Buscar"
										update=":form1:messagesEdit, :form1:objects"
										actionListener="#{catalogProgramStructureMB.findValuesCatalog}"
										onstart="PF('blockUIWidget').block()"
										oncomplete="PF('blockUIWidget').unblock()" />
									<p:commandButton styleClass="ui-button-flat" value="Limpiar"
										update=":form1:messagesEdit, :form1:objects, :form1:display_1"
										actionListener="#{catalogProgramStructureMB.findAllValuesCatalog}"
										onstart="PF('blockUIWidget').block();document.getElementById('form1:fnSearchInput').value='';document.getElementById('form1:funSearchInput').value='';
										document.getElementById('form1:progSearchInput').value='';document.getElementById('form1:spSearchInput').value='';document.getElementById('form1:proySearchInput').value='';
										document.getElementById('form1:nombreSearchInput').value='';document.getElementById('form1:estProgSearchInput').value='';document.getElementById('form1:sfSearchInput').value='';"
										oncomplete="PF('blockUIWidget').unblock()" />
								</div>
							</h:panelGroup>
						</h:panelGroup>
					</div>
				<!-- onclick="PF('dependenciesWdg').clearFilters();" -->
				<!-- END ALM -->


				<p:focus context="objects" id="focusTable" />

				<div class="sg-card">
					<div class="sg-card-h">
						<h2>Estructura programática</h2>
					</div>
				<p:dataTable id="objects" binding="#{table}" var="object"
					value="#{catalogProgramStructureMB.list}" styleClass="et_datatable"
					emptyMessage="No hay registros" editable="true" paginator="true"
					rows="10"
					paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					selectionMode="single" rowKey="#{object.id}"
					filteredValue="#{catalogProgramStructureMB.filteredList}"
					widgetVar="programStructureWdg">


					<p:ajax event="rowEdit"
						listener="#{catalogProgramStructureMB.onRowEdit}"
						update=":form1:messagesEdit, :form1:objects"
						oncomplete="$('.ui-row-editor span.ui-icon-pencil').each(function(){$(this).css('visibility','visible')});
						$('.ui-commandlink span.ui-icon-close').each(function(){$(this).css('visibility','visible')});" />
					<p:ajax event="rowEditCancel"
						listener="#{catalogProgramStructureMB.onRowCancel}"
						update=":form1:messagesEdit"
						oncomplete="PF('blockUIWidget').unblock();document.getElementById('form1:hideButton2').click();" />

					<p:column headerText="FN" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo0}" />
					</p:column>
					<!-- validatorMessage="FN solo permite valores alfanum&eacute;ricos" -->
					<p:column headerText="FN" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo0}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="campo0" value="#{object.campo0}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2"
									required="true" requiredMessage="El campo FN es requerido">
									<!-- 									<f:validateRegex pattern="^\s*([0-9a-zA-Z _-]*)\s*$" -->
									<!-- 										for="campo0" /> -->
									<p:keyFilter for="campo0" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="Fun" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo1}" />
					</p:column>

					<p:column headerText="Fun" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo1}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<!-- 							validatorMessage="Fun solo permite valores alfanum&eacute;ricos" -->
								<p:inputText id="campo1" value="#{object.campo1}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2">
									<!-- 									<f:validateRegex pattern="^\s*([0-9a-zA-Z _-]*)\s*$" for="campo1" /> -->
									<p:keyFilter for="campo1" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="SF" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo2}" />
					</p:column>

					<p:column headerText="SF" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo2}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<!-- 							validatorMessage="SF solo permite valores alfanum&eacute;ricos" -->
								<p:inputText id="campo2" value="#{object.campo2}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2">
									<!-- 									<f:validateRegex pattern="^\s*([0-9a-zA-Z _-]*)\s*$" for="campo2" /> -->
									<p:keyFilter for="campo2" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="Prog" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo3}" />
					</p:column>

					<p:column headerText="Prog" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo3}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<!-- 							validatorMessage="Prog solo permite valores alfanum&eacute;ricos" -->
								<p:inputText id="campo3" value="#{object.campo3}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2">
									<!-- 									<f:validateRegex pattern="^\s*([0-9a-zA-Z _-]*)\s*$" for="campo3" /> -->
									<p:keyFilter for="campo3" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="Proy" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo4}" />
					</p:column>

					<p:column headerText="Proy" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo4}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="campo4" value="#{object.campo4}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2">
									<p:keyFilter for="campo4" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>
					<!--
					<p:column headerText="Proy" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo5}" />
					</p:column>

					<p:column headerText="Proy" exportable="false" style="width:5%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo5}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="campo5" value="#{object.campo5}"
									disabled="#{object.id > 0}" style="width:100%" maxlength="2">
									<p:keyFilter for="campo5" mask="pint"></p:keyFilter>
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>
					-->
					<p:column headerText="Nombre" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo6}" />
					</p:column>

					<p:column headerText="Nombre" exportable="false"
						style="#{catalogProgramStructureMB.columnWidth}">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo6}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText value="#{object.campo6}" style="width:100%"
									maxlength="250" required="true"
									disabled="#{object.id > 0 and object.idsector == 1}"
									requiredMessage="El campo Nombre es requerido"
									validatorMessage="Nombre solo permite valores alfanum&eacute;ricos">
									<f:validateRegex
										pattern="^\s*([0-9a-zA-ZñÑ áÁéÉíÍóÓúÚüÜ_-]*)\s*$" for="campo6" />
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>


					<p:column headerText="EstProg" visible="false" width="0"
						exportable="true">
						<h:outputText value="#{object.campo7}" />
					</p:column>

					<p:column headerText="EstProg" exportable="false" style="width:10%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo7}" styleClass="sg-code" />
							</f:facet>
							<f:facet name="input">
								<h:outputText value="#{object.campo7}" />
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="Descripci&oacute;n" visible="false" width="0"
						exportable="true"
						rendered="#{catalogProgramStructureMB.gemUser.idSector == 1}">
						<h:outputText value="#{object.campo8}" />
					</p:column>

					<p:column headerText="Descripci&oacute;n" exportable="false"
						style="width:40%"
						rendered="#{catalogProgramStructureMB.gemUser.idSector == 1}">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{object.campo8}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText value="#{object.campo8}" style="width:100%"
									maxlength="200" required="true"
									requiredMessage="El campo Objetivo es requerido"
									validatorMessage="Objetivo solo permite valores alfanum&eacute;ricos">
									<f:validateRegex
										pattern="^\s*([0-9a-zA-ZñÑ áÁéÉíÍóÓúÚüÜ_-]*)\s*$" for="campo8" />
								</p:inputText>
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column headerText="Acciones" exportable="false" style="width:90px;" styleClass="sg-acciones-fila"><p:rowEditor
							rendered="#{catalogProgramStructureMB.gemUser.idSector == 1 || object.editable}" /></p:column>

					<f:facet name="footer">
						<div class="sg-export">
						<span class="sg-note">Exportar:</span>

						<h:commandLink styleClass="sg-btn-sm" onclick="PrimeFaces.monitorDownload(start, stop);"
							disabled="#{empty catalogProgramStructureMB.list}">
							<i class="pi pi-file-excel" /> Excel
							<p:fileDownload value="#{catalogProgramStructureMB.fileXls}" />
						</h:commandLink>

						<h:commandLink styleClass="sg-btn-sm" onclick="PrimeFaces.monitorDownload(start, stop);"
							disabled="#{empty catalogProgramStructureMB.list}">
							<i class="pi pi-align-left" /> TXT
							<p:fileDownload value="#{catalogProgramStructureMB.file}" />
						</h:commandLink>

						<h:commandLink styleClass="sg-btn-sm" onclick="PrimeFaces.monitorDownload(start, stop);"
							disabled="#{empty catalogProgramStructureMB.list}">
							<i class="pi pi-file-pdf" /> PDF
							<p:fileDownload value="#{catalogProgramStructureMB.filePdf}" />
						</h:commandLink>

						<h:commandLink styleClass="sg-btn-sm" onclick="PrimeFaces.monitorDownload(start, stop);"
							disabled="#{empty catalogProgramStructureMB.list}"
							actionListener="#{catalogProgramStructureMB.getFileCsvPl}">
							<i class="pi pi-file" /> CSV
							<!-- <p:dataExporter encoding="UTF-8" type="csv" target="objects"
								fileName="EstructuraProgramatica" pageOnly="false" /> -->
							<p:fileDownload value="#{catalogProgramStructureMB.csvByPl}" />
						</h:commandLink>
						</div>
					</f:facet>

				</p:dataTable>
				</div>
				</div>


				<p:commandButton id="hideButton"
					update=":form1:messagesEdit, :form1:objects"
					actionListener="#{catalogProgramStructureMB.showSuccesMessage()}"
					onstart="PF('blockUIWidget').block()"
					oncomplete="PF('blockUIWidget').unblock();" ajax="false"
					style="display: none;" />

				<p:commandButton id="hideButton2" update=":form1:objects"
					onstart="PF('blockUIWidget').block()"
					oncomplete="PF('blockUIWidget').unblock();" ajax="false"
					style="display: none;" />
				<br />
				<br />

				<p:dialog header="Borrar" widgetVar="confirmDeleteDlg"
					resizable="false" width="400" showEffect="clip"
					hideEffect="clip" modal="true">

					<h:outputText value="¿Está seguro de eliminar el registro?" />
					<p:outputPanel id="panelDelete" layout="block"
						style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">

						<p:commandButton value="Cancelar" styleClass="ui-button-flat"
							onclick="PF('confirmDeleteDlg').hide()" type="button" />
						<p:commandButton value="Aceptar" update=":form1:objects"
							actionListener="#{catalogProgramStructureMB.delete}"
							oncomplete="PF('confirmDeleteDlg').hide()" />
					</p:outputPanel>
				</p:dialog>

				<p:dialog id="panelValida" widgetVar="wingetPasswor"
					header="Contraseña de administrador" modal="true" styleClass="green">
					<p:panelGrid id="pgridpass" columns="2"
						styleClass="green col-md-4 col-centered row-centered " layout="tabular">
						<h:outputText value="Contraseña" />
						<h:inputSecret id="validatePass"
							value="#{catalogProgramStructureMB.validatePass}"
							onkeypress="if(event.keyCode == 27) {PF('wingetPasswor').hide(); return false;} if(event.keyCode == 13){ validatePass(); return false;}" />

						<h:outputText value="" />
						<p:commandButton value="Validar"
							update=":form1:messagesEdit, :form1:objects, :form1:focusTable"
							actionListener="#{catalogProgramStructureMB.insertRow}"
							oncomplete="PF('wingetPasswor').hide();document.getElementById('form1:validatePass').value=''; resetPass();" />
					</p:panelGrid>

				</p:dialog>

			</h:form>
			<script type="text/javascript">
			    function start() {
			        PF('blockUIWidget').block();
			     }
			 
			     function stop() {
			         PF('blockUIWidget').unblock();
			     }
           </script>
		</ui:define>
	</ui:composition>
</h:body> </html>
