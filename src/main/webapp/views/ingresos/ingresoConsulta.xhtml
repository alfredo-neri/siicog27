<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<!--
				SIICOG fase 2: estructura del prototipo (sicog-pantallas.html, "Consulta de Pólizas de Ingresos
				Propios"). Se conservan componentes, ids, valores, listeners y update de difem26; cambian el
				acomodo (dos tarjetas lado a lado) y la presentación del status y las cifras.
			-->
			<h:form id="form1">
				<p:growl id="messagesEdit" showDetail="true" sticky="true" />
				<p:focus context="objects" id="focusTable" />

				<h:panelGroup id="panelButton" layout="block" styleClass="sg-page">
					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Presupuesto y finanzas / Ingresos Propios</div>
							<h1>Consulta de Pólizas de Ingresos Propios</h1>
						</div>
					</div>

					<!-- ===== Mes y reporte ===== -->
					<div class="sg-card">
						<div class="sg-card-b sg-pol-foot">
							<div class="sg-actions" style="align-items: flex-end;">
								<div class="sg-field">
									<p:outputLabel for="mes" value="Mes" id="mesLabel" />
									<p:selectOneMenu id="mes" value="#{ingresoPropioConsultaMB.mes}" style="min-width: 170px;">
										<f:selectItems value="#{ingresoPropioConsultaMB.listMes}"
											var="item" itemValue="#{item.mes}"
											itemLabel="#{item.descripcion}" />
										<p:ajax event="change" update=":form1:objects detalleIngreso"
											listener="#{ingresoPropioConsultaMB.cargarPolizas}" />
									</p:selectOneMenu>
								</div>
								<p:commandButton id="generateportepdf" icon="pi pi-file-pdf"
									onstart="PF('blockUIWidget').block()"
									oncomplete="PF('blockUIWidget').unblock()"
									action="#{ingresoPropioConsultaMB.createPDF}" value="Ver reporte"
									update="form1:inlinePdf, :form1:messagesEdit">
								</p:commandButton>
							</div>
							<div class="sg-legend">
								<span>Status:</span>
								<span class="sg-chip ok">C · Correcto</span>
								<span class="sg-chip bad">I · Incorrecto</span>
							</div>
						</div>
					</div>

					<div class="sg-split">
						<!-- ===== Polizas de ingreso ===== -->
						<div class="sg-card">
							<div class="sg-card-h">
								<h2>Pólizas de ingreso <small>Cuenta 4223-1-4-1</small></h2>
								<span class="sg-note">Selecciona una póliza para ver su detalle</span>
							</div>
							<p:dataTable id="objects" binding="#{table}" var="object"
								value="#{ingresoPropioConsultaMB.polizas}"
								styleClass="et_datatable"
								emptyMessage="No hay registros" editable="true" paginator="true"
								rows="10"
								paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								selectionMode="single" rowKey="#{object.conpol}"
								selection="#{ingresoPropioConsultaMB.polideSelected}"
								widgetVar="dependenciesWdg">
								<p:ajax event="rowSelect"
									listener="#{ingresoPropioConsultaMB.cargarIngreso}"
									update=":form1:messagesEdit :form1:detalleIngreso" />
								<p:column headerText="Tipo" exportable="false" style="width: 56px;">
									<h:outputText value="#{object.tippol}" styleClass="sg-chip info" />
								</p:column>
								<p:column headerText="Mes" exportable="false" style="width: 50px;">
									<h:outputText value="#{object.mespol}" styleClass="sg-num" />
								</p:column>
								<p:column headerText="Con" exportable="false" style="width: 56px;">
									<h:outputText value="#{object.conpol}" styleClass="sg-num" />
								</p:column>
								<p:column headerText="Ren" exportable="false" style="width: 56px;">
									<h:outputText value="#{object.renpol}" styleClass="sg-num">
										<f:convertNumber pattern="###,###,##0.0" type="number" />
									</h:outputText>
								</p:column>
								<p:column headerText="Cuenta" exportable="false" style="width: 64px;">
									<h:outputText value="#{object.cuenta}" styleClass="sg-code" />
								</p:column>
								<p:column headerText="Scta" exportable="false" style="width: 120px;">
									<h:outputText value="#{object.scta}" styleClass="sg-code" />
								</p:column>
								<p:column headerText="Sscta" exportable="false" style="width: 140px;">
									<h:outputText value="#{object.sscta}" styleClass="sg-code" />
								</p:column>
								<p:column headerText="Ssscta" exportable="false" style="width: 64px;">
									<h:outputText value="#{object.ssscta}" styleClass="sg-code" />
								</p:column>
								<p:column headerText="Abonos" exportable="false" style="width: 110px; text-align: right;">
									<h:outputText value="#{object.canpolh}" styleClass="sg-num">
										<f:convertNumber pattern="###,###,##0.00" type="number" />
									</h:outputText>
								</p:column>
								<p:column headerText="Total ingreso" exportable="false"
									style="width: 120px; text-align: right;">
									<h:outputText value="#{object.ingreso}" styleClass="sg-num" style="font-weight: 600;">
										<f:convertNumber pattern="###,###,##0.00" type="number" />
									</h:outputText>
								</p:column>
							</p:dataTable>
						</div>

						<!-- ===== Detalle de la poliza ===== -->
						<h:panelGroup id="detalleIngreso" layout="block" styleClass="sg-card">
							<div class="sg-card-h">
								<h2>Detalle de la póliza</h2>
								<span class="sg-actions">
									<p:outputLabel value="Status" for="status" styleClass="sg-lbl" />
									<p:outputLabel id="status"
										value="#{empty ingresoPropioConsultaMB.status ? '—' : ingresoPropioConsultaMB.status}"
										styleClass="sg-chip #{ingresoPropioConsultaMB.status eq 'C' ? 'ok' : (ingresoPropioConsultaMB.status eq 'I' ? 'bad' : 'mute')}">
									</p:outputLabel>
								</span>
							</div>
							<p:dataTable var="detalle"
								value="#{ingresoPropioConsultaMB.ingresos}"
								emptyMessage="Selecciona una póliza para ver su detalle">
								<p:column headerText="Cta. detalle" style="width: 70px;">
									<h:outputText value="#{detalle.clave}" styleClass="sg-code" />
								</p:column>
								<p:column headerText="Nombre detalle">
									<h:outputText value="#{detalle.nombre}" />
								</p:column>
								<p:column headerText="Cantidad" style="width: 110px; text-align: right;">
									<h:outputLabel value="#{detalle.monto}" styleClass="sg-num">
										<f:convertNumber pattern="###,###,##0.00" type="number" />
									</h:outputLabel>
								</p:column>
							</p:dataTable>
							<div class="sg-total-row">
								<span>Total</span>
								<p:outputLabel id="total"
									value="#{ingresoPropioConsultaMB.totalIngreso}">
									<f:convertNumber pattern="###,###,##0.00" type="number" />
								</p:outputLabel>
							</div>
						</h:panelGroup>
					</div>

					<p:panel id="inlinePdf" style="border:0px"
						visible="#{ingresoPropioConsultaMB.uuid ne null}">

						<object type="application/pdf"
							data="#{request.contextPath}/GetFileInline?uuid=#{ingresoPropioConsultaMB.uuid}&amp;filename=#{ingresoPropioConsultaMB.endFilename}"
							height="380px" width="100%"> Tu browser no puede
							desplegar el PDF. </object>

					</p:panel>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
