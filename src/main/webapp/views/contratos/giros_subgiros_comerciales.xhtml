<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>


	<ui:composition template="/WEB-INF/layout/layout.xhtml">

		<ui:define name="content">
			<!--
				SIICOG: estructura de Contra-recibos (encabezado, tarjeta de datos y tarjeta de lista con buscador).
				Mismos ids (focus, contenedor, msn, guardar, panelForm1, giro, dataGrid, inputBusqueda, deleteRow),
				valores, acciones y update.
			-->
			<h:form id="form">
				<p:focus id="focus" />
				<p:remoteCommand name="buscar"
					actionListener="#{girosSubgirosMB.buscarSubgiros}"
					oncomplete="return false;" update=":form:dataGrid" />
				<p:remoteCommand name="guardar" id="guardar"
					actionListener="#{girosSubgirosMB.guardarSubgiro}"
					oncomplete="return false;"
					update=":form:dataGrid :form:msn :form:focus panelForm1" />
				<h:panelGroup id="contenedor" layout="block" styleClass="sg-page">

					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Contratos / Catálogos</div>
							<h1>Giros y Subgiros Comerciales</h1>
						</div>
					</div>

					<!-- ===== Datos del subgiro ===== -->
					<div class="sg-card">
						<div class="sg-card-h">
							<h2>Datos del subgiro comercial</h2>
						</div>
						<h:panelGroup id="panelForm1" layout="block" styleClass="sg-card-b">
							<p:messages id="msn" showDetail="true" closable="true" />
							<div class="sg-fields" style="grid-template-columns: minmax(0, 160px) minmax(0, 1fr);">
								<div class="sg-field" style="grid-column: span 2;">
									<p:outputLabel for="giro" value="Giro comercial (partida)" />
									<p:selectOneMenu id="giro"
										value="#{girosSubgirosMB.subgiroSelected.giro}"
										converter="genericConverter">
										<f:selectItems value="#{girosSubgirosMB.giros}" var="giro"
											itemLabel="#{giro.clvgas} #{giro.nomgas}" itemValue="#{giro}" />
									</p:selectOneMenu>
								</div>
								<div class="sg-field">
									<p:outputLabel for="clave" value="Clave" />
									<p:inputText id="clave" value="#{girosSubgirosMB.subgiroSelected.clave}"
										styleClass="mono" maxlength="4"
										onkeypress="if (event.keyCode == 13) {guardar(); return false; } if(event.keyCode == 27) { return false;}" />
								</div>
								<div class="sg-field">
									<p:outputLabel for="descripcion" value="Descripción" />
									<p:inputText id="descripcion"
										value="#{girosSubgirosMB.subgiroSelected.descripcion}"
										maxlength="200"
										onkeypress="if (event.keyCode == 13) {guardar(); return false; } if(event.keyCode == 27) { return false;}" />
								</div>
							</div>
							<div class="sg-actions" style="margin-top: 16px;">
								<p:commandButton value="Guardar" update=":form"
									action="#{girosSubgirosMB.guardarSubgiro}"
									icon="pi pi-save" />
								<p:commandButton value="Cancelar"
									update=":form:focus :form:msn :form:panelForm1"
									action="#{girosSubgirosMB.resetSubgiroSelected}"
									styleClass="ui-button-flat" icon="pi pi-times" />
							</div>
						</h:panelGroup>
					</div>

					<!-- ===== Subgiros registrados ===== -->
					<div class="sg-card">
						<div class="sg-card-h">
							<h2>Subgiros comerciales</h2>
							<div class="sg-actions">
								<p:inputText id="inputBusqueda" style="width: 300px;"
									value="#{girosSubgirosMB.busqueda}" placeholder="Buscar por partida, clave o descripción"
									onkeypress="if (event.keyCode == 13) {buscar(); return false; } if(event.keyCode == 27) { return false;}">
								</p:inputText>
								<p:commandButton icon="pi pi-search" title="Buscar"
									actionListener="#{girosSubgirosMB.buscarSubgiros()}"
									update=":form:dataGrid" />
							</div>
						</div>
						<p:dataTable id="dataGrid" var="object"
							value="#{girosSubgirosMB.subgiros}"
							emptyMessage="No existen subgiros. Los que guardes aparecerán aquí." paginator="true" rows="20"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink}"
							widgetVar="dataGrid" paginatorPosition="bottom"
							rowIndexVar="rowIndexCaptura">
							<p:column headerText="Partida" exportable="false" style="width: 90px;">
								<p:outputLabel value="#{object.giro.clvgas}" styleClass="sg-code" />
							</p:column>
							<p:column headerText="Nombre de la partida" exportable="false">
								<p:outputLabel value="#{object.giro.nomgas}" />
							</p:column>
							<p:column headerText="Clave" exportable="false" style="width: 80px;">
								<p:outputLabel value="#{object.clave}" styleClass="sg-code" />
							</p:column>
							<p:column headerText="Descripción del subgiro" exportable="false">
								<p:outputLabel value="#{object.descripcion}" />
							</p:column>
							<p:column headerText="Acciones" exportable="false" style="width: 100px;"
								styleClass="sg-acciones-fila">
								<p:commandLink update=":form:focus :form:panelForm1"
									styleClass="sg-ico" title="Editar">
									<f:setPropertyActionListener value="#{object}"
										target="#{girosSubgirosMB.subgiroSelected}" />
									<i class="pi pi-pencil" />
								</p:commandLink>
								<p:commandLink id="deleteRow" update=":form:msn :form:dataGrid"
									oncomplete="PF('deleteDialog').show()"
									styleClass="sg-borrar" title="Eliminar">
									<f:setPropertyActionListener value="#{object.id}"
										target="#{girosSubgirosMB.idTemporal}" />
									<i class="pi pi-trash" />
								</p:commandLink>
							</p:column>
						</p:dataTable>
					</div>
				</h:panelGroup>
			</h:form>
			<p:confirmDialog widgetVar="deleteDialog"
				message="¿Desea eliminar el subgiro comercial seleccionado?"
				header="Confirmación" severity="warn">
				<p:commandButton value="SI" label="SI"
					styleClass="ui-confirmdialog-yes ui-button-danger" icon="pi pi-trash"
					actionListener="#{girosSubgirosMB.deleteSubgiroa}"
					oncomplete="PF('deleteDialog').hide();"
					update=":form:dataGrid :form:msn :form" />
				<p:commandButton value="NO" label="NO"
					onclick="PF('deleteDialog').hide();"
					styleClass="ui-confirmdialog-no ui-button-outlined" icon="pi pi-times" />
			</p:confirmDialog>
		</ui:define>
	</ui:composition>
</h:body>
</html>
