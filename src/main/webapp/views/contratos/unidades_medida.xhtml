<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>


	<ui:composition template="/WEB-INF/layout/layout.xhtml">

		<ui:define name="content">
			<style>
.columna {
	width: 50%;
}

.input-max {
	width: 100% !important;
}

.buttons-form {
	display: flex !important;
	margin: auto;
	justify-content: center;
	align-items: center;
}

.table-busqueda {
	display: flex !important;
	align-items: center;
	justify-content: end;
}

.table-busqueda input {
	width: 50% !important;
}

.unidad-vigente {
	color: #2e7d32;
	font-weight: bold;
}

.unidad-baja {
	color: #b71c1c;
	font-weight: bold;
}

.resumen-catalogo {
	text-align: right;
	font-style: italic;
	padding-top: 6px;
}
</style>
			<h:form id="form">
				<p:focus id="focus" />
				<p:panel id="contenedor"
					header="Administración de unidades de medida"
					styleClass="green col-md-12 col-centered row-centered shadow-panel">
					<p:messages id="msn" showDetail="true" closable="true" />
					<p:remoteCommand name="buscar"
						actionListener="#{unidadesMedidaMB.buscarUnidades}"
						oncomplete="return false;" update=":form:dataGrid" />
					<p:remoteCommand name="guardar" id="guardar"
						actionListener="#{unidadesMedidaMB.guardarUnidad}"
						oncomplete="return false;"
						update=":form:dataGrid :form:msn :form:focus panelForm1" />
					<p:panel id="panelForm1">
						<div class="row">
							<div class="col-md-2">
								<p:outputLabel>Clave</p:outputLabel>
								<p:inputText value="#{unidadesMedidaMB.unidadSelected.clave}"
									styleClass="input-max" maxlength="10"
									onkeypress="if (event.keyCode == 13) {guardar(); return false; } if(event.keyCode == 27) { return false;}" />
							</div>
							<div class="col-md-6">
								<p:outputLabel>Descripcion</p:outputLabel>
								<p:inputText
									value="#{unidadesMedidaMB.unidadSelected.descripcion}"
									styleClass="input-max" maxlength="100"
									onkeypress="if (event.keyCode == 13) {guardar(); return false; } if(event.keyCode == 27) { return false;}" />
							</div>
							<div class="col-md-2">
								<p:outputLabel>Abreviatura</p:outputLabel>
								<p:inputText
									value="#{unidadesMedidaMB.unidadSelected.abreviatura}"
									styleClass="input-max" maxlength="20"
									onkeypress="if (event.keyCode == 13) {guardar(); return false; } if(event.keyCode == 27) { return false;}" />
							</div>
							<div class="col-md-2">
								<p:outputLabel>Estatus</p:outputLabel>
								<p:selectOneMenu id="activo"
									value="#{unidadesMedidaMB.unidadSelected.activo}"
									style="width: 100% !important;">
									<f:selectItem itemValue="1" itemLabel="Activo" />
									<f:selectItem itemValue="0" itemLabel="Inactivo" />
								</p:selectOneMenu>
							</div>
						</div>
						<div class="buttons-form">
							<p:commandButton value="Guardar" update=":form"
								action="#{unidadesMedidaMB.guardarUnidad}"
								styleClass="ui-confirmdialog-no " icon="ui-icon-disk" />
							<p:commandButton value="Cancelar"
								update=":form:focus :form:msn :form:panelForm1"
								action="#{unidadesMedidaMB.resetUnidadSelected}"
								styleClass="ui-confirmdialog-no" icon="ui-icon-closethick" />
						</div>
					</p:panel>
					<p:dataTable id="dataGrid" var="object"
						value="#{unidadesMedidaMB.unidades}" styleClass="et_datatable"
						emptyMessage="No existen registros" paginator="true" rows="20"
						paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink}"
						widgetVar="dataGrid" paginatorPosition="bottom"
						rowIndexVar="rowIndexCaptura">
						<f:facet name="header">
							<div class="table-busqueda">
								<h:outputText value="Busqueda: " />
								<p:inputText id="inputBusqueda"
									value="#{unidadesMedidaMB.busqueda}" placeholder="Ingrese texto"
									onkeypress="if (event.keyCode == 13) {buscar(); return false; } if(event.keyCode == 27) { return false;}">
								</p:inputText>
								<p:commandButton icon="ui-icon-search"
									actionListener="#{unidadesMedidaMB.buscarUnidades()}"
									update=":form:dataGrid" />
							</div>
						</f:facet>
						<p:column headerText="Clave" exportable="false" width="12%"
							style="text-align: left!important;">
							<p:outputLabel value="#{object.clave}" />
						</p:column>
						<p:column headerText="Descripción" exportable="false" width="44%"
							style="text-align: left!important;">
							<p:outputLabel value="#{object.descripcion}" />
						</p:column>
						<p:column headerText="Abreviatura" exportable="false" width="16%"
							style="text-align: left!important;">
							<p:outputLabel value="#{object.abreviatura}" />
						</p:column>
						<p:column headerText="Estatus" exportable="false" width="14%"
							styleClass="row-centered">
							<p:outputLabel value="#{object.vigente ? 'Activo' : 'Inactivo'}"
								styleClass="#{object.vigente ? 'unidad-vigente' : 'unidad-baja'}" />
						</p:column>
						<p:column headerText="Acciones" exportable="false" width="14%"
							styleClass="row-centered">
							<div class="buttons-form">
								<p:commandLink id="deleteRow" update=":form:msn :form:dataGrid"
									oncomplete="PF('deleteDialog').show()"
									image="ui-icon ui-icon-close" title="Eliminar">
									<f:setPropertyActionListener value="#{object.id}"
										target="#{unidadesMedidaMB.idTemporal}" />
									<h:outputText styleClass="ui-icon ui-icon-close" />
								</p:commandLink>
								<p:commandLink update=":form:focus :form:panelForm1"
									image="ui-icon ui-icon-edit" title="Editar">
									<f:setPropertyActionListener value="#{object}"
										target="#{unidadesMedidaMB.unidadSelected}" />
									<h:outputText styleClass="ui-icon ui-icon-pencil" />
								</p:commandLink>
								<p:commandLink update=":form:msn :form:dataGrid"
									action="#{unidadesMedidaMB.cambiarVigencia(object)}"
									title="#{object.vigente ? 'Dar de baja' : 'Reactivar'}">
									<h:outputText
										styleClass="ui-icon #{object.vigente ? 'ui-icon-circle-minus' : 'ui-icon-circle-check'}" />
								</p:commandLink>
							</div>
						</p:column>
					</p:dataTable>
					<div class="resumen-catalogo">
						<h:outputText
							value="#{unidadesMedidaMB.totalVigentes} unidad(es) vigente(s) de #{unidadesMedidaMB.totalUnidades} en el catálogo" />
					</div>
				</p:panel>
				<!--
					El confirmDialog va DENTRO del h:form a proposito. En
					giros_subgiros_comerciales.xhtml esta afuera y como layout.xhtml no
					envuelve el contenido en ningun form, el boton SI no alcanza a enviar
					nada y el borrado no se ejecuta. Aqui queda dentro para que si funcione.
				-->
				<p:confirmDialog widgetVar="deleteDialog"
					message="Desea eliminar la unidad de medida actual?"
					header="Confirmación" severity="alert">
					<p:commandButton value="SI" label="SI"
						style="margin-top:10px;padding:5px;"
						styleClass="ui-confirmdialog-yes" icon="ui-icon-check"
						actionListener="#{unidadesMedidaMB.deleteUnidad}"
						oncomplete="PF('deleteDialog').hide();"
						update=":form:dataGrid :form:msn" />
					<p:commandButton value="NO" label="NO" type="button"
						onclick="PF('deleteDialog').hide();"
						style="margin-top:10px;padding:5px;"
						styleClass="ui-confirmdialog-no" icon="ui-icon-cancel" />
				</p:confirmDialog>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
