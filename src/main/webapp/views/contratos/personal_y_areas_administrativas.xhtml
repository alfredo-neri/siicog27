<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>

	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<!--
				SIICOG: encabezado y tarjetas como Contra-recibos, dentro de las mismas pestañas. Mismos ids (tabs,
				formPersonal, formArea, panelPersonal, panelArea, panelFormArea, panelButtonsArea, area, nombre,
				cargo, domicilio, telefono, telfax, email, nombreArea, clave, dataGridPersonal, dataGridArea,
				inputBusqueda, deleteRow, focus*, msn*), valores, acciones y update.
			-->
			<div class="sg-page">
				<!-- ===== Encabezado de pantalla ===== -->
				<div class="sg-page-h">
					<div>
						<div class="sg-crumbs">Contratos / Catálogos</div>
						<h1>Personal y Áreas Administrativas</h1>
					</div>
				</div>

			<p:tabView id="tabs">
				<p:tab title="Personal administrativo">
					<h:form id="formPersonal">
						<p:remoteCommand name="guardarPersonal"
							actionListener="#{personalAreasAdministrativasMB.guardarAdministrativo}"
							update=":tabs:formPersonal focusPersonal" />
						<p:remoteCommand name="buscarPersonal"
							actionListener="#{personalAreasAdministrativasMB.buscarAdministrativo()}"
							update="dataGridPersonal" />
						<p:messages id="msnPersonal" showDetail="true" closable="true"
							showSummary="false" style="text-align:initial" />
						<p:focus id="focusPersonal" />
						<h:panelGroup id="panelPersonal" layout="block" style="display: grid; gap: 24px;">
							<p:focus id="focus" />
							<!-- ===== Datos del personal ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Datos del personal administrativo</h2>
								</div>
								<div class="sg-card-b">
									<div class="sg-fields" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
										<div class="sg-field" style="grid-column: span 3;">
											<p:outputLabel for="area" value="Unidad administrativa" />
											<p:selectOneMenu id="area" converter="genericConverter"
												value="#{personalAreasAdministrativasMB.administrativoSelected.administrativa}">
												<f:selectItems value="#{personalAreasAdministrativasMB.areas}"
													var="area" itemLabel="#{area.descripcion}"
													itemValue="#{area}" />
											</p:selectOneMenu>
										</div>
										<div class="sg-field" style="grid-column: span 2;">
											<p:outputLabel for="nombre" value="Nombre" />
											<p:inputText id="nombre"
												value="#{personalAreasAdministrativasMB.administrativoSelected.nombre}"
												maxlength="100" onblur="value=value.toUpperCase()"
												onkeypress="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}" />
										</div>
										<div class="sg-field">
											<p:outputLabel for="cargo" value="Cargo" />
											<p:inputText id="cargo"
												value="#{personalAreasAdministrativasMB.administrativoSelected.cargo}"
												maxlength="100" onblur="value=value.toUpperCase()"
												onkeypress="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}" />
										</div>
										<div class="sg-field" style="grid-column: span 3;">
											<p:outputLabel for="domicilio" value="Domicilio" />
											<p:inputText id="domicilio"
												value="#{personalAreasAdministrativasMB.administrativoSelected.domicilio}"
												maxlength="100" onblur="value=value.toUpperCase()"
												onkeypress="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}" />
										</div>
										<div class="sg-field">
											<p:outputLabel for="telefono" value="Teléfono" />
											<p:inputText id="telefono" maxlength="100" styleClass="mono"
												value="#{personalAreasAdministrativasMB.administrativoSelected.telefono}"
												onkeyup="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}">
											</p:inputText>
										</div>
										<div class="sg-field">
											<p:outputLabel for="telfax" value="Telfax" />
											<p:inputText id="telfax" styleClass="mono"
												value="#{personalAreasAdministrativasMB.administrativoSelected.telfax}"
												maxlength="100"
												onkeyup="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}">
											</p:inputText>
										</div>
										<div class="sg-field">
											<p:outputLabel for="email" value="Correo electrónico" />
											<p:inputText id="email"
												value="#{personalAreasAdministrativasMB.administrativoSelected.email}"
												maxlength="100"
												onkeyup="if (event.which == 13) {guardarPersonal();return false;}if(event.keyCode == 27) {return false;}">
											</p:inputText>
										</div>
									</div>
									<div class="sg-actions" style="margin-top: 16px;">
										<p:commandButton value="Guardar" widgetVar="guardar"
											update=":tabs:formPersonal"
											action="#{personalAreasAdministrativasMB.guardarAdministrativo}"
											icon="pi pi-save" />
										<p:commandButton value="Cancelar"
											disabled="#{personalAreasAdministrativasMB.administrativoSelected.id==null}"
											update=":tabs:formPersonal"
											action="#{personalAreasAdministrativasMB.resetAdministrativoSelected}"
											styleClass="ui-button-flat" icon="pi pi-times" />
									</div>
								</div>
							</div>

							<!-- ===== Personal registrado ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Personal registrado</h2>
									<div class="sg-actions">
										<p:inputText id="inputBusqueda" style="width: 300px;"
											value="#{personalAreasAdministrativasMB.busquedaPersonal}"
											placeholder="Buscar por nombre o cargo"
											onkeypress="if (event.which == 13) {buscarPersonal();return false;}if(event.keyCode == 27) {return false;}">
										</p:inputText>
										<p:commandButton icon="pi pi-search" title="Buscar"
											actionListener="#{personalAreasAdministrativasMB.buscarAdministrativo}"
											update=":tabs:formPersonal:dataGridPersonal" />
									</div>
								</div>
								<p:dataTable id="dataGridPersonal" var="object"
									value="#{personalAreasAdministrativasMB.personal}"
									emptyMessage="No existe personal registrado. El que guardes aparecerá aquí." paginator="true" rows="10"
									rowsPerPageTemplate="5,10,20"
									paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
									widgetVar="dataGridPersonal" paginatorPosition="bottom"
									rowIndexVar="rowIndexCaptura">
									<p:column styleClass="toggler" style="width: 40px;">
										<p:rowToggler />
									</p:column>
									<p:column headerText="Nombre" exportable="false">
										<p:outputLabel value="#{object.nombre}" />
									</p:column>
									<p:column headerText="Cargo" exportable="false">
										<p:outputLabel value="#{object.cargo}" />
									</p:column>
									<p:column headerText="Unidad administrativa" exportable="false">
										<p:outputLabel value="#{object.administrativa.descripcion}" />
									</p:column>
									<p:column headerText="Acciones" exportable="false" style="width: 100px;"
										styleClass="sg-acciones-fila">
										<p:commandLink
											update=":tabs:formPersonal:focusPersonal :tabs:formPersonal:msnPersonal :tabs:formPersonal:panelPersonal "
											styleClass="sg-ico" title="Editar">
											<f:setPropertyActionListener value="#{object}"
												target="#{personalAreasAdministrativasMB.administrativoSelected}" />
											<i class="pi pi-pencil" />
										</p:commandLink>
										<p:commandLink id="deleteRow"
											update=":tabs:formPersonal:focusPersonal :tabs:formPersonal:msnPersonal :tabs:formPersonal:panelPersonal"
											oncomplete="PF('deletePersonal').show()"
											styleClass="sg-borrar" title="Eliminar">
											<f:setPropertyActionListener value="#{object}"
												target="#{personalAreasAdministrativasMB.administrativoSelected}" />
											<i class="pi pi-trash" />
										</p:commandLink>
									</p:column>
									<p:rowExpansion>
										<div class="sg-fields" style="grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 4px;">
											<div class="sg-field" style="grid-column: span 4;">
												<span class="sg-note">Domicilio</span>
												<h:outputText value="#{object.domicilio}" />
											</div>
											<div class="sg-field">
												<span class="sg-note">Teléfono</span>
												<h:outputText value="#{object.telefono}" styleClass="sg-code" />
											</div>
											<div class="sg-field">
												<span class="sg-note">Telfax</span>
												<h:outputText value="#{object.telfax}" styleClass="sg-code" />
											</div>
											<div class="sg-field" style="grid-column: span 2;">
												<span class="sg-note">Correo</span>
												<h:outputText value="#{object.email}" />
											</div>
										</div>
									</p:rowExpansion>
								</p:dataTable>
							</div>
						</h:panelGroup>
					</h:form>
				</p:tab>
				<p:tab title="Áreas administrativas">
					<h:form id="formArea">
						<p:remoteCommand name="guardarArea"
							actionListener="#{personalAreasAdministrativasMB.guardarArea}"
							update=":tabs:formArea :tabs:formPersonal:area" />
						<p:remoteCommand name="buscarArea"
							actionListener="#{personalAreasAdministrativasMB.buscarArea()}"
							update=":tabs:formArea:dataGridArea" />

						<h:panelGroup id="panelArea" layout="block" style="display: grid; gap: 24px;">
							<p:messages id="msnArea" showDetail="true" closable="true"
								showSummary="false" style="text-align:initial" />
							<p:focus id="focusArea" />
							<!-- ===== Datos del área ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Datos del área administrativa</h2>
								</div>
								<div class="sg-card-b">
									<h:panelGroup id="panelFormArea" layout="block">
										<div class="sg-fields" style="grid-template-columns: minmax(0, 1fr) minmax(0, 220px);">
											<div class="sg-field">
												<p:outputLabel for="nombreArea" value="Nombre del área administrativa" />
												<p:inputText id="nombreArea" maxlength="200"
													value="#{personalAreasAdministrativasMB.areaSelected.descripcion}"
													onkeypress="if (event.which == 13) {guardarArea();return false;}if(event.keyCode == 27) {return false;}" />
											</div>
											<div class="sg-field">
												<p:outputLabel for="clave" value="Clave del área" />
												<p:inputText id="clave" maxlength="15" styleClass="mono"
													value="#{personalAreasAdministrativasMB.areaSelected.clave}"
													onkeypress="if (event.which == 13) {guardarArea();return false;}if(event.keyCode == 27) {return false;}" />
											</div>
										</div>
									</h:panelGroup>
									<h:panelGroup id="panelButtonsArea" layout="block" styleClass="sg-actions" style="margin-top: 16px;">
										<p:commandButton value="Guardar" widgetVar="guardar"
											update=":tabs:formArea"
											action="#{personalAreasAdministrativasMB.guardarArea}"
											icon="pi pi-save" />
										<p:commandButton value="Cancelar"
											disabled="#{personalAreasAdministrativasMB.areaSelected.id==null}"
											update=":tabs:formArea:focusArea :tabs:formArea:msnArea :tabs:formArea:panelArea"
											action="#{personalAreasAdministrativasMB.resetareaSelected}"
											styleClass="ui-button-flat" icon="pi pi-times" />
									</h:panelGroup>
								</div>
							</div>

							<!-- ===== Áreas registradas ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Áreas administrativas registradas</h2>
									<div class="sg-actions">
										<p:inputText id="inputBusqueda" style="width: 300px;"
											value="#{personalAreasAdministrativasMB.busquedaAreas}"
											placeholder="Buscar por nombre o clave"
											onkeypress="if (event.which == 13) {buscarArea();return false;}if(event.keyCode == 27) {return false;}">
										</p:inputText>
										<p:commandButton icon="pi pi-search" title="Buscar"
											actionListener="#{personalAreasAdministrativasMB.buscarArea}"
											update=":tabs:formArea:dataGridArea" />
									</div>
								</div>
								<p:dataTable id="dataGridArea" var="object"
									value="#{personalAreasAdministrativasMB.areas}"
									emptyMessage="No existen áreas. Las que guardes aparecerán aquí." paginator="true" rows="10"
									rowsPerPageTemplate="5,10,20"
									paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
									widgetVar="dataGrid" paginatorPosition="bottom"
									rowIndexVar="rowIndexCaptura">
									<p:column headerText="Nombre" exportable="false">
										<p:outputLabel value="#{object.descripcion}" />
									</p:column>
									<p:column headerText="Clave del área" exportable="false" style="width: 200px;">
										<p:outputLabel value="#{object.clave}" styleClass="sg-code" />
									</p:column>
									<p:column headerText="Acciones" exportable="false" style="width: 100px;"
										styleClass="sg-acciones-fila">
										<p:commandLink
											update=":tabs:formArea:focusArea :tabs:formArea:msnArea :tabs:formArea:panelArea "
											styleClass="sg-ico" title="Editar">
											<f:setPropertyActionListener value="#{object}"
												target="#{personalAreasAdministrativasMB.areaSelected}" />
											<i class="pi pi-pencil" />
										</p:commandLink>
										<p:commandLink id="deleteRow"
											oncomplete="PF('deleteArea').show()"
											styleClass="sg-borrar" title="Eliminar">
											<f:setPropertyActionListener value="#{object}"
												target="#{personalAreasAdministrativasMB.areaSelected}" />
											<i class="pi pi-trash" />
										</p:commandLink>
									</p:column>
								</p:dataTable>
							</div>
						</h:panelGroup>
					</h:form>
				</p:tab>
			</p:tabView>
			</div>

			<p:confirmDialog widgetVar="deletePersonal"
				message="¿Desea eliminar a la persona seleccionada?" header="Confirmación"
				severity="warn">
				<p:commandButton value="SI" label="SI"
					styleClass="ui-confirmdialog-yes ui-button-danger" icon="pi pi-trash"
					actionListener="#{personalAreasAdministrativasMB.deleteAdministrativo}"
					oncomplete="PF('deletePersonal').hide();"
					update=":tabs:formPersonal:dataGridPersonal :tabs:formPersonal:msnPersonal " />
				<p:commandButton value="NO" label="NO"
					onclick="PF('deletePersonal').hide();"
					styleClass="ui-confirmdialog-no ui-button-outlined" icon="pi pi-times" />
			</p:confirmDialog>
			<p:confirmDialog widgetVar="deleteArea"
				message="¿Desea eliminar el área seleccionada?" header="Confirmación"
				severity="warn">
				<p:commandButton value="SI" label="SI"
					styleClass="ui-confirmdialog-yes ui-button-danger" icon="pi pi-trash"
					actionListener="#{personalAreasAdministrativasMB.deleteArea}"
					oncomplete="PF('deleteArea').hide();"
					update=":tabs:formArea:dataGridArea :tabs:formArea:msnArea :tabs:formPersonal:area" />
				<p:commandButton value="NO" label="NO"
					onclick="PF('deleteArea').hide();"
					styleClass="ui-confirmdialog-no ui-button-outlined" icon="pi pi-times" />
			</p:confirmDialog>
		</ui:define>
	</ui:composition>
</h:body>
</html>
