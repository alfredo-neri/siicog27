<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>


	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:form id="form1">

				<p:panel id="panel" header="Convertidor a TXT"
					styleClass="green col-md-6 col-centered row-centered shadow-panel">
					<p:commandButton value="Download" style="visibility: hidden;"
						id="downloadFile" ajax="false"
						onclick="PrimeFaces.monitorDownload(start, stop);">
						<p:fileDownload value="#{convertidorTxtMB.downloadFile}" />
					</p:commandButton>

					<p:messages id="messages" showDetail="true" closable="true">

					</p:messages>
					<p:panelGrid columns="2"
						styleClass="col-centered row-centered ui-noborder">
						<p:column>
							<p:outputLabel value="Nombe Archivo de Salida" />
						</p:column>
						<p:column>
							<p:inputText value="#{convertidorTxtMB.outFileName}" id="outName"
								placeholder="Nombre del Archivo de Saida" required="true"
								requiredMessage="Campo Obligatorio" >
								<p:ajax event="blur" update="outName"></p:ajax>
								<pe:keyFilter regEx="/[a-zA-Z]/i" />
							</p:inputText>
						</p:column>
						<p:column colspan="2">
							<p:fileUpload mode="advanced" multiple="false" sizeLimit="10000000000002400"
								onstart="PrimeFaces.monitorDownload(start, stop);"
								id="uploadFile" styleClass="ui-noborder" cancelLabel="Cancelar"
								uploadLabel="Cargar" allowTypes="/(\.|\/)(xlsx)$/"
								invalidSizeMessage="Maximum file size allowed is 100 KB"
								invalidFileMessage="Solo se permiten archivos excel .xlsx!"
								update="messages, outName"
								oncomplete="jQuery('#form1\\:downloadFile').click();"
								fileUploadListener="#{convertidorTxtMB.handleFileUpload}">

							</p:fileUpload>
						</p:column>
					</p:panelGrid>
				</p:panel>
			</h:form>
			<script type="text/javascript">
    //<![CDATA[
    function start() {
        PF('statusDialog').show();
    }

    function stop() {
        PF('statusDialog').hide();
    }
    //]]>
</script>
		</ui:define>
	</ui:composition>
</h:body>
</html>
