<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<h:outputScript library="js" name="saldos_iniciales.js" />

			<!--
				SIICOG fase 2: estructura del prototipo (sicog-pantallas.html, "Saldos Iniciales").
				Se conservan componentes, ids, valores, listeners y update de difem26, y las clases que usa
				resources/js/saldos_iniciales.js para mostrar los campos paso a paso (cve_acceso, cuenta, scta,
				header-show, sal-show). Los contenedores que muestra con fadeIn envuelven a las rejillas, para
				que el display:block que deja jQuery no rompa el acomodo.
			-->
			<h:form id="salIniForm" class="form-inline" widgetVar="salIniForm">

				<h:panelGroup id="main_panel" layout="block" styleClass="sg-page">
					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Administración / Utilerías</div>
							<h1>Saldos Iniciales</h1>
						</div>
					</div>

					<h:panelGroup id="panel_ctrl" layout="block" styleClass="sg-page">
						<!-- ===== Acceso y cuenta ===== -->
						<div class="sg-card">
							<div class="sg-card-h">
								<h2>Cuenta</h2>
								<span class="sg-note">Escribe la clave de acceso para habilitar la captura</span>
							</div>
							<div class="sg-card-b">
								<div class="sg-fields" style="grid-template-columns: minmax(0, 220px) minmax(0, 140px) minmax(0, 220px);">
									<div class="sg-field">
										<p:outputLabel for="cve_acceso" value="Clave de acceso" />
										<p:password value="#{saldosInicialesMB.cveAcceso}" size="20"
											id="cve_acceso" class="cve_acceso"
											onkeypress="if(event.keyCode == 13){ return false; }" />
									</div>
									<div class="cuenta-grp header-show" style="display: none">
										<div class="sg-field">
											<p:outputLabel for="cuenta" value="Cuenta" />
											<p:inputMask maxlength="4" size="4"
												value="#{saldosInicialesMB.cuenta}" id="cuenta" class="cuenta mono">
												<p:keyFilter regEx="/[0-9_]/i" />
											</p:inputMask>

											<!-- onblur="validateAccount()" -->
										</div>
									</div>
									<div class="scta-grp header-show" style="display: none">
										<div class="sg-field">
											<p:outputLabel for="scta" value="Scta" />
											<p:inputText size="15" value="#{saldosInicialesMB.scta}"
												maxlength="15" id="scta" class="scta mono" />
											<!-- onblur="validateScta()" -->
										</div>
									</div>
								</div>
							</div>
						</div>

						<h:panelGroup id="updatable_panel" layout="block" styleClass="sg-page">

							<!-- ===== Subcuentas ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Subcuentas</h2>
									<span class="sg-note">Doble clic en una subcuenta para capturar su saldo</span>
								</div>
								<div class="sg-card-b" style="padding-bottom: 0;">
									<div class="sg-field">
										<p:outputLabel for="nom_cta" value="Nombre de la cuenta" />
										<p:inputText class="form-control"
											value="#{saldosInicialesMB.nomcta}"
											readonly="true" id="nom_cta" />
									</div>
								</div>
								<p:dataTable var="cuenta" value="#{saldosInicialesMB.cuentas}"
									selectionMode="single"
									selection="#{saldosInicialesMB.selectedAccount}"
									widgetVar="resultTable" scrollable="true" scrollHeight="300"
									rowKey="#{cuenta.id}" style="margin-top: 16px;">
									<p:ajax event="rowDblselect"
										listener="#{saldosInicialesMB.accountSelect}"
										oncomplete="dblClickCallback(xhr, status, args)"
										update="salIniForm:updatable_fields" />
									<p:column headerText="Cta" style="width: 70px;">
										<h:outputText value="#{cuenta.cuenta}" styleClass="sg-code" />
									</p:column>

									<p:column headerText="Scta" style="width: 150px;">
										<h:outputText value="#{cuenta.scuenta}" styleClass="sg-code" />
									</p:column>

									<p:column headerText="Sscta" style="width: 175px;">
										<h:outputText value="#{cuenta.sscuenta}" styleClass="sg-code" />
									</p:column>

									<p:column headerText="Ssscta" style="width: 80px;">
										<h:outputText value="#{cuenta.ssscuenta}" styleClass="sg-code" />
									</p:column>

									<p:column headerText="Sssscta" style="width: 80px;">
										<h:outputText value="#{cuenta.sssscuenta}" styleClass="sg-code" />
									</p:column>

									<p:column headerText="Título">
										<h:outputText value="#{cuenta.nomcta}" />
									</p:column>

									<p:column headerText="Niv" style="width: 70px;">
										<h:outputText value="#{cuenta.nivcta}"
											styleClass="sg-chip #{cuenta.nivcta eq 'S' ? 'cian' : 'mute'}" />
									</p:column>
								</p:dataTable>
							</div>

							<!-- ===== Saldo inicial ===== -->
							<div class="sg-card">
								<div class="sg-card-h">
									<h2>Saldo inicial</h2>
								</div>
								<div class="sg-card-b">
									<h:panelGroup id="updatable_fields" layout="block" style="display: grid; gap: 16px;">
										<div class="sg-field">
											<p:outputLabel for="antecesor" value="Antecesor" />
											<p:inputText class="form-control" size="20"
												value="#{saldosInicialesMB.antecesor}" id="antecesor"
												readonly="true" />
										</div>
										<!-- Aqui va el mensaje del doble click para editar -->
										<p:growl id="growl" showDetail="true" sticky="true"></p:growl>
										<div class="sg-fields" style="grid-template-columns: minmax(0, 260px) auto; align-items: end;">
											<div class="sg-field">
												<p:outputLabel for="sdoInicial" value="Saldo inicial" />
												<p:inputNumber size="20"
													value="#{saldosInicialesMB.sdoInicial}" id="sdoInicial"
													emptyValue="zero" decimalPlaces="2"
													disabled="#{saldosInicialesMB.salIniBtnDisabled}"
													minValue="-9999999999999.99" maxValue="9999999999999.99"
													decimalSeparator="." thousandSeparator="," />
											</div>
											<div class="sal-show">
												<div class="sg-field">
													<span class="sg-lbl">Suma</span>
													<h:outputText size="20" styleClass="sg-ro sg-num"
														value="#{saldosInicialesMB.mentity.suma}" id="suma">
														<f:convertNumber pattern="#0.00" locale="es_MX" />
													</h:outputText>
												</div>
											</div>
										</div>
										<div class="sal-show">
											<div class="sg-meses">
												<div class="sg-field">
													<p:outputLabel for="ene" value="Ene" />
													<p:inputNumber size="20" id="ene"
														value="#{saldosInicialesMB.mentity.ene}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="feb" value="Feb" />
													<p:inputNumber size="20" id="feb"
														value="#{saldosInicialesMB.mentity.feb}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="mar" value="Mar" />
													<p:inputNumber size="20" id="mar"
														value="#{saldosInicialesMB.mentity.mar}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="abr" value="Abr" />
													<p:inputNumber size="20" id="abr"
														value="#{saldosInicialesMB.mentity.abr}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="may" value="May" />
													<p:inputNumber size="20" id="may"
														value="#{saldosInicialesMB.mentity.may}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="jun" value="Jun" />
													<p:inputNumber size="20" id="jun"
														value="#{saldosInicialesMB.mentity.jun}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="jul" value="Jul" />
													<p:inputNumber size="20" id="jul"
														value="#{saldosInicialesMB.mentity.jul}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="ago" value="Ago" />
													<p:inputNumber size="20" id="ago"
														value="#{saldosInicialesMB.mentity.ago}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="sep" value="Sep" />
													<p:inputNumber size="20" id="sep"
														value="#{saldosInicialesMB.mentity.sep}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="oct" value="Oct" />
													<p:inputNumber size="20" id="oct"
														value="#{saldosInicialesMB.mentity.oct}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="nov" value="Nov" />
													<p:inputNumber size="20" id="nov"
														value="#{saldosInicialesMB.mentity.nov}" emptyValue="zero"
														decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
												<div class="sg-field">
													<p:outputLabel for="dic" value="Dic" />
													<p:inputNumber value="#{saldosInicialesMB.mentity.dic}"
														size="20" id="dic" emptyValue="zero" decimalPlaces="2"
														disabled="#{saldosInicialesMB.monthsDisabled}"
														decimalSeparator="." thousandSeparator=",">
														<p:ajax event="change" update="suma" />
													</p:inputNumber>
												</div>
											</div>
										</div>
									</h:panelGroup>
									<div class="sg-actions">
										<p:commandButton id="corrButton" icon="pi pi-check"
											value="Guardar saldo"
											oncomplete="dblClickCallback(xhr, status, args)"
											disabled="#{saldosInicialesMB.salIniBtnDisabled}"
											actionListener="#{saldosInicialesMB.save}"
											update="updatable_panel" />
									</div>
								</div>
							</div>
						</h:panelGroup>
					</h:panelGroup>
				</h:panelGroup>

				<p:remoteCommand name="validatePass" update="updatable_panel"
					actionListener="#{saldosInicialesMB.validatePass}"
					onsuccess="correctPass()" onerror="invalidPass()"
					onstart="showStatus()" oncomplete="hideStatus()" />

				<p:remoteCommand name="validateAccount" update="updatable_panel"
					actionListener="#{saldosInicialesMB.validateAccount}"
					onsuccess="validAccount()" onstart="showStatus()"
					oncomplete="hideStatus()" />

				<p:remoteCommand name="validateScta" update="updatable_panel"
					actionListener="#{saldosInicialesMB.validateScta}"
					onsuccess="validAccount()" onstart="showStatus()"
					oncomplete="hideStatus()" />
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
