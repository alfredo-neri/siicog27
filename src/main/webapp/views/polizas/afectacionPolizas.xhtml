<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>

	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<!--
				SIICOG fase 2: estructura del prototipo (sicog-pantallas.html, "Cierre Contable").
				Se conservan componentes, ids, valores, listeners y update de difem26. El estado de cada paso
				(activo, hecho, bloqueado) sale de la misma bandera que ya habilitaba los controles
				(afectacionPolizaMB.activarButton).
			-->
			<h:form id="form1">

				<p:growl id="messagesEdit" showDetail="true" sticky="true" />

				<h:panelGroup id="panel" layout="block" styleClass="sg-page" style="max-width: 760px;">

					<!-- ===== Encabezado de pantalla ===== -->
					<div class="sg-page-h">
						<div>
							<div class="sg-crumbs">Contabilidad / Afectación</div>
							<h1>Cierre Contable</h1>
						</div>
					</div>

					<div class="sg-alert warn" role="note">
						<i class="pi pi-exclamation-triangle" />
						<div><b>Proceso restringido</b>Afectar pólizas modifica los saldos contables del mes seleccionado. Valida tu contraseña para continuar.</div>
					</div>

					<div class="sg-card">
						<div class="sg-steps">
							<!-- ===== Paso 1: validar contraseña ===== -->
							<div class="sg-step #{afectacionPolizaMB.activarButton ? 'active' : 'done'}">
								<span class="n">#{afectacionPolizaMB.activarButton ? '1' : '✓'}</span>
								<h3>Validar contraseña</h3>
								<h:panelGroup id="pgrid2" layout="block" styleClass="sg-actions body">
									<h:inputSecret id="pass" value="#{afectacionPolizaMB.pass}" styleClass="sg-inp"
										style="max-width: 280px;" a:placeholder="Contraseña de cierre" a:autocomplete="off"
										xmlns:a="jakarta.faces.passthrough" />
									<p:commandButton value="Validar contraseña" ajax="false"
										id="vidalaPass"
										update=":form1:panel"

										actionListener="#{afectacionPolizaMB.isTruePass}"

										/>
								</h:panelGroup>
							</div>

							<!-- ===== Paso 2: afectar ===== -->
							<div class="sg-step #{afectacionPolizaMB.activarButton ? 'locked' : 'active'}">
								<span class="n">2</span>
								<h3>Afectar póliza</h3>
								<h:panelGroup id="pgrid" layout="block" styleClass="sg-actions body">
									<p:selectOneMenu id="selectmes"
									          value="#{afectacionPolizaMB.mes}"
									          disabled="#{afectacionPolizaMB.activarButton}"
									          icon="ui-icon-person"
										required="true" style="min-width: 140px;">
										<f:selectItems value="#{afectacionPolizaMB.lisMes}" var="m"
											itemValue="#{m.mes}" itemLabel="#{m.mes}" />
									</p:selectOneMenu>
									<p:commandButton value="Afectar póliza" id="polizanumber" styleClass="sg-btn-accent"
										actionListener="#{afectacionPolizaMB.cierrePoliza}"
										icon="pi pi-check" update=":form1:messagesEdit: form1:panel"
										ajax="true"
										onclick="PrimeFaces.monitorDownload(start, stop);"
										disabled="#{afectacionPolizaMB.activarButton}" />
									<p:commandButton value="Descargar archivo" ajax="false" styleClass="ui-button-outlined"
										id="download"
										icon="pi pi-download"
										disabled="#{afectacionPolizaMB.activeDowload}"
										actionListener="#{afectacionPolizaMB.sendFileToUser}"

										>

									</p:commandButton>
								</h:panelGroup>
							</div>
						</div>
					</div>
				</h:panelGroup>
			</h:form>
			<script type="text/javascript">
			    function start() {
			        PF('blockUIWidget').block();
			     }

			     function stop() {
			         PF('blockUIWidget').unblock();
			     }
           </script>
		</ui:define>
	</ui:composition>
</h:body>
</html>
