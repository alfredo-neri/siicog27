<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">

<body>
	<!-- Barra superior de SIICOG -->
	<ui:composition>
		<header class="sg-top">
			<button type="button" class="sg-burger" id="sg-burger"
				aria-label="Mostrar u ocultar menú" aria-expanded="true">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
			</button>
			<a class="sg-brand" href="#{request.contextPath}/home.xhtml">
				<img src="#{request.contextPath}/resources/siicog/img/siicog-logo.png"
					alt="SIICOG · Sistema Inteligente de Contabilidad Gubernamental" />
			</a>
			<div class="sg-logos">
				<span class="sg-plate">
					<img src="#{request.contextPath}/resources/siicog/img/logos-institucionales.png"
						alt="Gobierno del Estado de México · DIF Estado de México" />
				</span>
			</div>
			<div class="sg-spacer"></div>
			<h:panelGroup styleClass="sg-fy" rendered="#{not empty menuMB.ejercicio}">
				Ejercicio Fiscal #{menuMB.ejercicio}
			</h:panelGroup>
			<h:panelGroup rendered="#{not empty menuMB.userDetails}">
				<h:outputLink id="sg-usuario" value="#" styleClass="sg-user" onclick="return false;">
					<span class="sg-avatar">#{menuMB.iniciales}</span>
					<span class="sg-who">#{menuMB.nombreUsuario}<small>#{menuMB.userDetails.role}</small></span>
				</h:outputLink>
				<!-- Panel Apariencia: solo administradores (la pagina tambien lo exige en SecurityConfig) -->
				<h:outputLink value="#{request.contextPath}/views/administracion/apariencia.xhtml" styleClass="sg-logout sg-ajustes"
					title="Apariencia del sistema" rendered="#{apariencia.administrador}">
					<i class="pi pi-palette" aria-hidden="true" />
					<span class="sg-label">Apariencia</span>
				</h:outputLink>
				<a class="sg-logout" href="#{request.contextPath}/logout">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
					<span class="sg-label">Salir</span>
				</a>
			</h:panelGroup>
		</header>
	</ui:composition>
</body>
</html>
