<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
	Marco de SIICOG: barra superior, menu lateral, contenido y pie (prototipo sicog-pantallas.html).
	Lo usan todas las vistas (template="/WEB-INF/layout/layout.xhtml"); cada una llena "content".
-->
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	data-sg-tema="#{apariencia.tema}" data-sg-apariencia="#{apariencia.version}">
<h:head>
	<ui:param name="root" value="#{request.contextPath}/" />
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" type="image/png" href="#{request.contextPath}/resources/siicog/img/siicog-logo.png" />
	<!-- Estilos heredados que todavia usan las vistas (rejilla de Bootstrap 3, clases de cssLayout) -->
	<h:outputStylesheet library="css" name="cssLayout.css" />
	<h:outputStylesheet library="css" name="bootstrap.min.css" />
	<h:outputStylesheet library="css" name="override-panelgrid.css" />
	<!-- Sin bootstrap.min.js, jQuery UI 1.11 ni notas adhesivas: no son compatibles con jQuery 4
	     (PrimeFaces 16) y solo los usaba la barra anterior (ver resources/js/gem.js) -->
	<h:outputScript library="js" name="underscore.js" />
	<!-- Textos en espanol de calendarios y componentes: los de PrimeFaces 16 (calendar_es.js era formato PF5) -->
	<h:outputScript library="primefaces" name="locales/locale-es.js" />
	<h:outputScript library="js" name="resetPassword.js" />
	<h:outputScript library="js" name="tiff.min.js" />
	<h:outputScript library="js" name="tiffView.js" />
	<h:outputStylesheet library="css" name="slick.css" />
	<h:outputStylesheet library="css" name="slick-theme.css" />
	<style>
.renglon {
	font-size: 12px;
}
</style>
	<!-- Sin la regla .customDialog de difem26 (margin: 20px 10px en el contenido): dejaba una franja vacia
	     entre el encabezado y el cuerpo de los dialogos de users.xhtml -->

	<!-- SIICOG: al final, para que prevalezca sobre los estilos heredados. ?v= cambia en cada arranque
	     (siicog.recursos) para que el navegador no use una copia anterior de estos archivos. -->
	<f:facet name="last">
		<link rel="stylesheet" href="#{request.contextPath}/resources/siicog/iconos-jqueryui.css?v=#{siicog.recursos}" />
		<link rel="stylesheet" href="#{request.contextPath}/resources/siicog/siicog.css?v=#{siicog.recursos}" />
		<!-- Tema personalizado del panel Apariencia (vacio con los temas fijos; siicog.js lo actualiza) -->
		<style id="sg-tema-css">#{apariencia.css}</style>
		<!-- gem.js: start()/stop() de las descargas (PrimeFaces.monitorDownload); despues de jQuery -->
		<script src="#{request.contextPath}/resources/js/gem.js?v=#{siicog.recursos}"></script>
		<script src="#{request.contextPath}/resources/siicog/siicog.js?v=#{siicog.recursos}" defer="defer"></script>
	</f:facet>
	<title>SIICOG · Sistema Inteligente de Contabilidad Gubernamental</title>
</h:head>
<h:body>
	<!--
		Unica ventana de espera de la aplicacion: la usan Generar (PF('blockUIWidget').block()), las
		descargas de Excel/TXT (start/stop de gem.js con PrimeFaces.monitorDownload) y los procesos de carga.
		Antes cada vista declaraba la suya; ver herramientas/tema/unificar_espera.py.
	-->
	<pe:blockUI widgetVar="blockUIWidget">
		<div class="sg-espera" role="status" aria-live="polite">
			<div class="sg-espera-icono">
				<span class="sg-espera-spinner"></span>
				<i class="pi pi-hourglass" />
			</div>
			<div class="sg-espera-titulo">Procesando su solicitud</div>
			<div class="sg-espera-texto">Esto puede tardar unos segundos. Por favor espere.</div>
		</div>
	</pe:blockUI>

	<!-- Header Facelets: barra superior -->
	<ui:insert name="header">
		<ui:include src="/WEB-INF/layout/header.xhtml" />
	</ui:insert>

	<div class="sg-layout">
		<ui:include src="/WEB-INF/layout/menu.xhtml" />
		<div class="sg-scrim" id="sg-scrim"></div>

		<main class="sg-main">
			<div class="sg-content">
				<!-- Content Facelets -->
				<ui:insert name="content">

				</ui:insert>
			</div>

			<!-- Footer Facelets -->
			<ui:insert name="footer">
				<ui:include src="/WEB-INF/layout/footer.xhtml" />
			</ui:insert>
		</main>
	</div>

	<h:outputScript library="js" name="slick.min.js" />
</h:body>
</html>
