<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">
<h:body>
	<ui:composition template="/WEB-INF/layout/layout.xhtml">
		<ui:define name="content">
			<div style="display: grid; gap: 20px;">
				<div class="sg-welcome">
					<canvas id="sg-grid" aria-hidden="true"></canvas>
					<span class="hi">#{menuMB.saludo}, #{menuMB.nombreUsuario}</span>
					<h1>¡Bienvenido!</h1>
					<span class="sys">Sistema Inteligente de Contabilidad Gubernamental</span>
					<div class="tags">
						<h:panelGroup styleClass="sg-tag" rendered="#{not empty menuMB.ejercicio}">Ejercicio Fiscal #{menuMB.ejercicio}</h:panelGroup>
						<span class="sg-tag" id="sg-fecha" style="color: var(--marino-100)">&#8212;</span>
					</div>
				</div>

				<h:panelGroup layout="block" rendered="#{not empty menuMB.accesosRapidos}"
					style="display: grid; gap: 12px;">
					<h2 class="sg-section-h">Accesos rápidos</h2>
					<div class="sg-quick">
						<ui:repeat value="#{menuMB.accesosRapidos}" var="acceso">
							<a class="sg-qa" href="#{acceso.url}">
								<span class="ic"><i class="#{acceso.icono}" /></span>
								<b>#{acceso.titulo}</b>
								<small>#{acceso.descripcion}</small>
							</a>
						</ui:repeat>
					</div>
				</h:panelGroup>
			</div>
		</ui:define>
	</ui:composition>
</h:body>
</html>
